# Lint config for CI (.github/workflows/ci.yml). A focused set: real errors
# (pyflakes, syntax/IO), likely bugs (bugbear), imports and modern syntax.
target-version = "py314"
line-length = 120
extend-exclude = ["FlowDownload.spec"]

[lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
ignore = [
    "B008",   # FastAPI's Depends()/Header()/Cookie() defaults are the framework's idiom
    "UP042",  # DownloadStatus(str, Enum) -> StrEnum would change what str() returns
]
