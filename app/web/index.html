<!DOCTYPE html>
<html lang="en" class="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowDownload</title>
<script>
// First paint only: the saved theme ("system" | "light" | "dark") is cached
// here so the page doesn't flash light before /api/settings answers.
try{ const t=localStorage.getItem("fd-theme")||"system";
  if(t==="dark" || (t==="system" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark"); }catch(_){}
</script>
<style>
/* ============================================================
   "Bento Mono": greyscale, rounded cards, one floating dock.
   Bundled fonts (app/web/fonts, served by /fonts/<name>) so the UI
   needs no network and makes no third-party requests.
   ============================================================ */
@font-face{font-family:"Instrument Sans";src:url(/fonts/InstrumentSans-latin.woff2) format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:"DM Mono";src:url(/fonts/DMMono-400-latin.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"DM Mono";src:url(/fonts/DMMono-500-latin.woff2) format("woff2");font-weight:500;font-display:swap}

/* Token names kept from the previous theme (shadcn/ui style), so every
   component below and in the scripts reads the same variables. The one
   colour is --destructive, reserved for failures. */
:root{
  --background:#F4F4F3;
  --foreground:#111111;
  --card:#FFFFFF;
  --card-foreground:#111111;
  --popover:#FFFFFF;
  --popover-foreground:#111111;
  --primary:#111111;
  --primary-foreground:#FFFFFF;
  --secondary:#F2F2F1;
  --secondary-foreground:#111111;
  --muted:#F2F2F1;
  --muted-foreground:#5E5E5E;
  --accent:#EDEDEB;
  --accent-foreground:#111111;
  --destructive:#B42318;
  --destructive-foreground:#FFFFFF;
  --success:#111111;
  --warning:#6B6B69;
  --border:#E5E5E3;
  --input:#D6D6D3;
  --ring:#111111;
  --track:#ECECEA;
  --dot-idle:#B5B5B3;
  --dot-busy:#8A8A88;
  --radius:14px;
  --shadow-md:0 8px 28px rgba(0,0,0,.07);
  --shadow-lg:0 24px 64px rgba(0,0,0,.16);
}
.dark{
  --background:#0F0F10;
  --foreground:#F2F2F2;
  --card:#18181A;
  --card-foreground:#F2F2F2;
  --popover:#1E1E20;
  --popover-foreground:#F2F2F2;
  --primary:#F2F2F2;
  --primary-foreground:#111111;
  --secondary:#222224;
  --secondary-foreground:#F2F2F2;
  --muted:#222224;
  --muted-foreground:#A3A3A3;
  --accent:#2A2A2C;
  --accent-foreground:#F2F2F2;
  --destructive:#F0605A;
  --destructive-foreground:#111111;
  --success:#F2F2F2;
  --warning:#A3A3A3;
  --border:#2A2A2C;
  --input:#3A3A3C;
  --ring:#F2F2F2;
  --track:#2A2A2C;
  --dot-idle:#5E5E5E;
  --dot-busy:#8A8A88;
  --shadow-md:0 8px 28px rgba(0,0,0,.45);
  --shadow-lg:0 24px 64px rgba(0,0,0,.6);
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--background);color:var(--foreground);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--input);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;
  border-radius:17px;border:1px solid transparent;font-size:13px;font-weight:500;white-space:nowrap;
  transition:background .13s,border-color .13s,color .13s,opacity .13s,transform .08s}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover:not(:disabled){opacity:.88}
.btn-outline{border-color:var(--border);background:var(--card)}
.btn-outline:hover:not(:disabled),.btn-ghost:hover:not(:disabled){background:var(--accent)}
.btn-destructive{background:var(--destructive);color:var(--destructive-foreground)}
.btn-icon{width:34px;padding:0}
.btn-sm{height:30px;padding:0 12px;font-size:12.5px;border-radius:15px}
.btn-sm.btn-icon{width:30px;padding:0}

.badge{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;border-radius:12px;
  font-size:12px;font-weight:500;background:var(--muted);color:var(--foreground);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dot,var(--dot-idle));flex:none}
.badge-downloading,.badge-completed{--dot:var(--foreground)}
.badge-retrying{--dot:var(--dot-busy)}
.badge-queued,.badge-paused,.badge-cancelled{--dot:var(--dot-idle);color:var(--muted-foreground)}
.badge-failed{--dot:var(--destructive);color:var(--destructive)}

.input{height:38px;width:100%;padding:0 14px;border-radius:19px;border:1px solid var(--input);
  background:var(--card);font-size:13px;transition:border-color .13s,box-shadow .13s}
.input:focus{outline:none;border-color:var(--foreground);box-shadow:0 0 0 3px var(--accent)}
.input::placeholder{color:var(--muted-foreground)}
.input[readonly]{color:var(--muted-foreground);cursor:default}
select.input{cursor:pointer;appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 16px) 16px,calc(100% - 12px) 16px;background-size:4px 4px;background-repeat:no-repeat}
.label{display:block;font-size:12px;font-weight:600;color:var(--muted-foreground);margin-bottom:6px}

.switch{position:relative;width:36px;height:21px;border-radius:99px;background:var(--input);transition:background .16s;flex:none;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:99px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .16s}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(15px)}

.checkbox{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--input);background:var(--card);flex:none;display:grid;place-items:center;transition:background .12s,border-color .12s;pointer-events:none}
.checkbox[aria-checked="true"],.checkbox[data-indeterminate="true"]{background:var(--primary);border-color:var(--primary)}
.checkbox[aria-checked="true"]::after{content:"";width:8px;height:5px;border:1.8px solid var(--primary-foreground);border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
.checkbox[data-indeterminate="true"]::after{content:"";width:8px;height:1.8px;background:var(--primary-foreground);border:0;transform:none}
.cb{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer}

.kbd{display:inline-block;min-width:18px;padding:1px 6px;border-radius:5px;border:1px solid var(--border);
  background:var(--muted);font-size:11px;font-family:"DM Mono",ui-monospace,monospace;color:var(--muted-foreground);text-align:center}

/* ---------- shell ---------- */
.app{height:100vh;display:flex;flex-direction:column}
.page{flex:1;overflow-y:auto;padding:6px 32px 128px}
/* The window's title bar is blended into this background (app/ui/
   macos_window.py), so the page starts right under the traffic lights. */
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:20px}
.top h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.025em;line-height:1.1}
.top p{margin:0;font-size:15px;color:var(--muted-foreground)}
/* Only shown while the live connection is down (see renderStats). */
.conn{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 13px;border-radius:15px;align-self:center;
  background:var(--card);border:1px solid var(--border);font-size:13px;color:var(--foreground)}
.conn::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--input);border-top-color:var(--foreground);animation:spin .9s linear infinite}
.stale{opacity:.6;transition:opacity .2s}

.card{background:var(--card);border:1px solid var(--border);border-radius:28px}

/* ---------- bento top row ---------- */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-bottom:26px}
.hero{grid-column:span 7;grid-row:span 2;padding:28px;display:flex;flex-wrap:wrap;gap:30px;align-items:center;min-height:300px}
.speedcard{grid-column:span 5;padding:22px 24px;display:flex;flex-direction:column;gap:10px}
.slotcard{grid-column:span 5;padding:20px 24px;display:flex;flex-direction:column;gap:14px}
@media (max-width:1100px){.hero,.speedcard,.slotcard{grid-column:1/-1}}

.hring{position:relative;width:224px;height:224px;flex:none;border-radius:50%}
.hring .hole{position:absolute;inset:17px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.hring .num{font-size:58px;font-weight:600;letter-spacing:-.05em;line-height:1}
.hring .num small{font-size:23px;color:var(--muted-foreground);font-weight:500}
.hero-main{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:14px}
.hero-main h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.25;word-break:break-all}
.hero-host{color:var(--muted-foreground)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.stats3 div{background:var(--card);padding:11px 14px;display:flex;flex-direction:column;gap:3px}
.stats3 span:first-child{font-size:12px;color:var(--muted-foreground)}
.stats3 span:last-child{font-size:16px}
.hero-idle{display:flex;flex-direction:column;gap:8px;justify-content:center}
.hero-idle h2{margin:0;font-size:22px;font-weight:600}
.hero-idle p{margin:0;color:var(--muted-foreground);max-width:380px}

.cardhead{display:flex;justify-content:space-between;align-items:baseline}
.cardhead b{font-weight:600}
.cardhead span{font-size:12px;color:var(--muted-foreground)}
.bigspeed{display:flex;align-items:baseline;gap:8px}
.bigspeed b{font-size:46px;font-weight:600;letter-spacing:-.04em;line-height:1}
.bigspeed span{font-size:15px;color:var(--muted-foreground)}
.bars{display:flex;align-items:flex-end;gap:4px;height:64px}
.bars i{flex:1;border-radius:3px;background:var(--track);min-height:3px;transition:height .3s}
.bars i:last-child{background:var(--foreground)}
.stepper{display:flex;align-items:center;gap:6px;background:var(--muted);border-radius:20px;padding:3px}
.stepper button{width:32px;height:32px;border-radius:16px;background:var(--card);font-size:16px}
.stepper button:hover{background:var(--accent)}
.stepper span{min-width:22px;text-align:center;font-size:15px}
.sysrow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted-foreground)}
.sysrow b{color:var(--foreground);font-weight:500}
.diskbar{flex:1;height:5px;border-radius:99px;background:var(--track);overflow:hidden}
.diskbar i{display:block;height:100%;background:var(--foreground);border-radius:99px}
#chromeText{margin:0;font-size:12px;color:var(--muted-foreground);line-height:1.45}

/* ---------- toolbar + bulk bar ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.nav{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:16px;
  border:1px solid var(--border);background:var(--card);font-size:13px;font-weight:500;transition:background .12s}
.nav:hover{background:var(--accent)}
.nav[aria-current="true"]{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
.nav .dot{display:none}
.nav .count{font-family:"DM Mono",ui-monospace,monospace;font-size:11.5px;opacity:.65}
.tools-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{position:relative;width:240px}
.search .input{padding-left:36px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted-foreground);pointer-events:none}
.tb-sep{width:1px;height:20px;background:var(--border);margin:0 2px}

.bulkbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 10px;margin-bottom:14px;
  background:var(--card);border:1px solid var(--border);border-radius:20px;font-size:13px}
.bulkbar b{font-weight:600}
.bulkbar[data-has-selection="false"] [data-bulk]:not([data-bulk="all"]){pointer-events:none;opacity:.4}

/* ---------- download cards ---------- */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;position:relative}
.row{position:relative;display:flex;flex-direction:column;gap:12px;min-height:196px;padding:18px;
  background:var(--card);border:1px solid var(--border);border-radius:24px;cursor:default;
  transition:box-shadow .15s,border-color .15s}
.row:hover{box-shadow:var(--shadow-md)}
.row[data-state="failed"]{border-color:color-mix(in srgb,var(--destructive) 38%,var(--border))}
.row[data-selected="true"]{border-color:var(--foreground)}
.row[data-active="true"]{box-shadow:0 0 0 2px var(--foreground)}
.rhead{display:flex;align-items:center;gap:8px}
/* Floats over the file tile's corner, so it takes no space until shown. */
.rhead .cb{position:absolute;top:8px;left:8px;z-index:2;background:var(--card);border-radius:9px;
  box-shadow:0 1px 3px rgba(0,0,0,.12);opacity:0;transition:opacity .12s}
.row:hover .cb,.row[data-selected="true"] .cb,.list[data-anyselected="true"] .cb,.row:focus-within .cb{opacity:1}
.ficon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;
  font-family:"DM Mono",ui-monospace,monospace;font-size:11px;font-weight:500;background:var(--muted);color:var(--foreground)}
.mring{margin-left:auto;position:relative;width:44px;height:44px;border-radius:50%;flex:none}
.mring span{position:absolute;inset:4px;border-radius:50%;background:var(--card);display:grid;place-items:center;
  font-family:"DM Mono",ui-monospace,monospace;font-size:10px}
.rmain{min-width:0;display:flex;flex-direction:column;gap:4px}
.fname{font-size:15px;font-weight:600;line-height:1.3;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fhost{font-size:12px;color:var(--muted-foreground)}
.rstatus{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto}
.rmeta{display:flex;gap:8px;font-family:"DM Mono",ui-monospace,monospace;font-size:12px;color:var(--muted-foreground)}
.rspeed,.reta{font-weight:400}
.rbot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;color:var(--muted-foreground);min-height:17px}
.rbot .sep{opacity:.45}
.rerr{color:var(--destructive)}
.ractions{display:flex;gap:4px;opacity:0;transition:opacity .12s}
.row:hover .ractions,.row[data-active="true"] .ractions,.row:focus-within .ractions{opacity:1}

.segbar{position:relative;height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.segbar i{position:absolute;top:0;left:0;height:100%;background:var(--foreground);transition:width .28s linear}
.segbar[data-state="failed"] i{background:var(--destructive)}
.segbar[data-state="paused"] i,.segbar[data-state="queued"] i,.segbar[data-state="cancelled"] i{background:var(--dot-idle)}
.segbar[data-state="retrying"] i{background:var(--dot-busy)}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:56px 20px;background:var(--card);border:1px dashed var(--input);border-radius:28px}
.empty h3{margin:0;font-size:16px;font-weight:600}
.empty p{margin:0;font-size:13px;color:var(--muted-foreground);max-width:320px}
.empty .ring{width:48px;height:48px;border-radius:50%;background:var(--muted);display:grid;place-items:center;color:var(--muted-foreground)}

/* ---------- library ---------- */
#library-view{display:none}
#library-view.active{display:block}
.lib-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));grid-auto-flow:dense;gap:16px}
@media (min-width:900px){.lib-grid .lib-card:first-child{grid-column:span 2;grid-row:span 2}}
.lib-card{display:flex;flex-direction:column;border-radius:24px;border:1px solid var(--border);overflow:hidden;cursor:pointer;
  background:var(--card);transition:transform .15s,box-shadow .15s}
.lib-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.lib-thumb{flex:1;width:100%;min-height:140px;aspect-ratio:16/10;background:var(--muted);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.lib-card:first-child .lib-thumb{aspect-ratio:auto}
.lib-thumb img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.15)}
.lib-thumb-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:600;color:var(--muted-foreground)}
.lib-play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:background .14s}
.lib-card:hover .lib-play-overlay{background:rgba(0,0,0,.18)}
.lib-play-btn{width:44px;height:44px;border-radius:50%;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;opacity:0;transform:scale(.85);transition:opacity .14s,transform .14s}
.lib-card:hover .lib-play-btn{opacity:1;transform:none}
.lib-audio-thumb{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted-foreground)}
.lib-audio-icon{opacity:.7}
.lib-audio-wave{display:flex;align-items:center;gap:3px;height:24px}
.lib-wave-bar{width:4px;border-radius:2px;background:var(--muted-foreground);opacity:.5;animation:wave 1.2s ease-in-out infinite}
.lib-wave-bar:nth-child(1){height:8px}.lib-wave-bar:nth-child(2){animation-delay:.15s;height:16px}.lib-wave-bar:nth-child(3){animation-delay:.3s;height:12px}.lib-wave-bar:nth-child(4){animation-delay:.1s;height:20px}.lib-wave-bar:nth-child(5){animation-delay:.25s;height:10px}
@keyframes wave{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
.lib-meta{padding:14px 16px}
.lib-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.lib-info{font-size:12px;color:var(--muted-foreground);display:flex;align-items:center;gap:6px;font-family:"DM Mono",ui-monospace,monospace}
.lib-type-badge{font-family:"Instrument Sans",sans-serif;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--muted);color:var(--foreground)}
.lib-empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:64px 20px;background:var(--card);border:1px dashed var(--input);border-radius:28px}
.lib-empty-icon{width:56px;height:56px;border-radius:18px;background:var(--muted);display:grid;place-items:center;color:var(--muted-foreground)}
.lib-empty h3{margin:0;font-size:16px;font-weight:600}
.lib-empty p{margin:0;font-size:13px;color:var(--muted-foreground);max-width:320px}

/* ---------- library player ---------- */
.lib-player-scrim{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lib-player-card{width:100%;max-width:920px;max-height:88vh;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;
  background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-lg);animation:pop .2s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.lib-player-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
.lib-player-head .ficon{width:40px;height:40px}
.lib-player-info{flex:1;min-width:0}
.lib-player-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-player-host{font-size:12px;color:var(--muted-foreground);margin-top:1px}
.lib-player-close{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;background:var(--muted)}
.lib-player-close:hover{background:var(--accent)}
.lib-player-body{padding:16px;overflow-y:auto;display:flex;flex-direction:column;flex:1;min-height:0}
.lib-player-body video,.lib-player-body audio{width:100%;border-radius:16px 16px 0 0;background:#000;display:block;max-height:55vh}
.lib-player-no-preview{display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px;color:var(--muted-foreground)}
#libPlayerWrap{flex:0 0 auto;overflow:hidden}
.lib-player-foot{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}
.lib-ctrl{display:flex;align-items:center;gap:10px;padding:12px 8px 8px;color:#fff;font-size:12px;user-select:none;
  background:#000;border-radius:0 0 16px 16px}
.lib-ctrl-btn{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:99px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
.lib-ctrl-btn:hover{background:rgba(255,255,255,.2)}
.lib-ctrl-btn svg{width:20px;height:20px;display:block;fill:#fff;stroke:none}
.lib-ctrl-time{font-variant-numeric:tabular-nums;flex:none;min-width:96px;text-align:center;font-family:"DM Mono",ui-monospace,monospace}
.lib-ctrl-seek{-webkit-appearance:none;appearance:none;flex:1;height:16px;background:transparent;cursor:pointer;padding:0;margin:0}
.lib-ctrl-seek::-webkit-slider-runnable-track{height:5px;border-radius:99px;
  background:linear-gradient(to right,#fff 0%,#fff var(--seek-pct,0%),rgba(255,255,255,.28) var(--seek-pct,0%),rgba(255,255,255,.28) 100%)}
.lib-ctrl-seek::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;margin-top:-4px;border:0}
.lib-ctrl-volume{-webkit-appearance:none;appearance:none;width:80px;height:14px;background:transparent;cursor:pointer;padding:0;margin:0}
.lib-ctrl-volume::-webkit-slider-runnable-track{height:3px;border-radius:99px;background:rgba(255,255,255,.25)}
.lib-ctrl-volume::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:11px;height:11px;border-radius:50%;background:#fff;margin-top:-4px;border:0}

/* ---------- detail sheet (slide-over) ---------- */
.sheet{position:fixed;top:14px;right:14px;bottom:14px;width:390px;max-width:calc(100vw - 28px);z-index:40;
  display:flex;flex-direction:column;overflow:hidden;background:var(--card);border:1px solid var(--border);
  border-radius:28px;box-shadow:var(--shadow-lg);animation:slidein .18s cubic-bezier(.2,.9,.3,1)}
.sheet-head{padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.sheet-head .t{display:flex;align-items:flex-start;gap:12px}
.sheet-head h2{margin:0;font-size:16px;font-weight:600;word-break:break-all;line-height:1.35}
.tabs{display:flex;gap:4px;padding:10px 16px 0;flex:none}
.tab{height:32px;padding:0 14px;border-radius:16px;font-size:13px;font-weight:500;color:var(--muted-foreground)}
.tab:hover{background:var(--accent);color:var(--foreground)}
.tab[aria-selected="true"]{background:var(--foreground);color:var(--background)}
.sheet-body{flex:1;overflow-y:auto;padding:16px 20px 20px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:12.5px;align-items:baseline}
.kv dt{color:var(--muted-foreground)}
.kv dd{margin:0;word-break:break-all}
.hr{height:1px;background:var(--border);margin:16px 0}
.sect{font-size:12px;font-weight:600;color:var(--muted-foreground);margin-bottom:10px}
.timeline{position:relative;height:26px;border-radius:8px;background:var(--muted);overflow:hidden;margin-bottom:7px}
.timeline i{position:absolute;top:0;height:100%}
.timeline i[data-t="ok"]{background:var(--foreground);opacity:.7}
.timeline i[data-t="stall"]{background:var(--destructive);opacity:.6}
.timeline i[data-t="wait"]{background:repeating-linear-gradient(45deg,var(--dot-idle) 0 4px,transparent 4px 8px)}
.tl-legend{display:flex;gap:12px;font-size:11px;color:var(--muted-foreground)}
.log{display:flex;flex-direction:column}
.log-item{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.log-item:last-child{border-bottom:0}
.log-time{color:var(--muted-foreground);font-size:11px;padding-top:1px}
.log-item[data-lv="error"] .log-msg{color:var(--destructive)}
.hdr-block{background:var(--muted);border-radius:12px;padding:10px 12px;font-size:11px;line-height:1.65;word-break:break-all;margin-bottom:9px}
.hdr-block .k{font-weight:600}

/* ---------- dock ---------- */
.dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:4px;
  padding:6px;max-width:calc(100vw - 24px);overflow-x:auto;background:var(--card);border:1px solid var(--border);
  border-radius:30px;box-shadow:var(--shadow-md)}
.dock .btn{height:44px;border-radius:22px;padding:0 16px;font-size:13.5px}
.dock .btn-icon{width:44px;padding:0}
.dock .btn-primary{padding:0 20px;font-weight:600}
.dock-sep{width:1px;height:24px;background:var(--border);margin:0 4px;flex:none}
.view-nav{display:flex;gap:2px}
.view-btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:22px;font-size:13.5px;font-weight:500;white-space:nowrap}
.view-btn:hover{background:var(--accent)}
.view-btn[aria-current="true"]{background:var(--accent);font-weight:600}
.view-btn .count{font-family:"DM Mono",ui-monospace,monospace;font-size:11.5px;color:var(--muted-foreground)}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.36);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .14s ease-out}
.dialog{width:100%;max-width:520px;max-height:calc(100vh - 60px);display:flex;flex-direction:column;
  background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:30px;
  box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .16s cubic-bezier(.2,.9,.3,1)}
.dialog-head{padding:24px 26px 12px}
.dialog-head h2{margin:0 0 4px;font-size:22px;font-weight:600;letter-spacing:-.02em}
.dialog-head p{margin:0;font-size:13px;color:var(--muted-foreground)}
.dialog-body{padding:4px 26px 18px;overflow-y:auto;flex:1}
.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 26px 22px}
.dialog-foot .btn{height:42px;border-radius:21px;padding:0 20px}
/* Add download rises from the dock as a bottom sheet, as in the design. */
.scrim:has(.dialog[aria-labelledby="addTitle"]){place-items:end center;padding-bottom:24px}
.dialog[aria-labelledby="addTitle"]{max-width:720px;animation:rise .2s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.setrow:last-child{border-bottom:0}
.setrow .txt{flex:1;min-width:0}
.setrow .txt div{font-size:13.5px;font-weight:500}
.setrow .txt p{margin:2px 0 0;font-size:12px;color:var(--muted-foreground);line-height:1.4}

.menu{position:fixed;z-index:60;min-width:200px;padding:6px;background:var(--popover);border:1px solid var(--border);
  border-radius:18px;box-shadow:var(--shadow-lg);animation:pop .11s ease-out}
.menu button{display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 12px;border-radius:12px;font-size:13px;text-align:left}
.menu button:hover{background:var(--accent)}
.menu button[data-danger="true"]{color:var(--destructive)}
.menu .msep{height:1px;background:var(--border);margin:5px 4px}

.toasts{position:fixed;right:18px;bottom:96px;z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{display:flex;align-items:flex-start;gap:10px;min-width:260px;max-width:360px;padding:12px 14px;background:var(--popover);
  border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);animation:slidein .2s cubic-bezier(.2,.9,.3,1)}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.toast .tt{font-size:13px;font-weight:600}
.toast .td{font-size:12px;color:var(--muted-foreground);margin-top:1px}
.toast .ti{color:var(--foreground)}
.toast[data-kind="err"] .ti{color:var(--destructive)}

.dropzone{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.28);display:grid;place-items:center;pointer-events:none}
.dropzone div{background:var(--popover);padding:22px 30px;border-radius:24px;border:2px dashed var(--foreground);box-shadow:var(--shadow-lg);font-weight:600;font-size:15px}

.shortcuts{display:grid;grid-template-columns:1fr auto;gap:9px 20px;font-size:13px;align-items:center}
.shortcuts .g{grid-column:1/-1;font-size:12px;font-weight:600;color:var(--muted-foreground);margin-top:10px}
.shortcuts .g:first-child{margin-top:0}

.hidden{display:none !important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}}
@media (max-width:760px){.page{padding:20px 16px 128px}.top h1{font-size:32px}.search{width:100%}.tools-right{margin-left:0;width:100%}}
</style>
</head>
<body>
<div class="app">
  <div class="page" id="page">

    <header class="top">
      <h1 id="viewTitle">Downloads</h1>
      <p id="summary">Loading…</p>
      <span class="conn hidden" id="connNotice" role="status">Reconnecting… numbers may be out of date</span>
    </header>

    <div id="dlView">
      <div class="bento">
        <section class="card hero" id="hero" aria-label="Top download"></section>

        <section class="card speedcard" aria-label="Total speed">
          <div class="cardhead"><b>Total speed</b><span>last minute</span></div>
          <div class="bigspeed"><b class="mono" id="totalSpeed">0</b><span class="mono" id="totalSpeedUnit">B/s</span></div>
          <div class="bars" id="speedBars" role="img" aria-label="Total download speed over the last minute"></div>
        </section>

        <section class="card slotcard" aria-label="Downloads at once">
          <div style="display:flex;align-items:center;gap:14px">
            <div style="flex:1;display:flex;flex-direction:column;gap:3px">
              <b style="font-weight:600">Downloads at once</b>
              <span style="color:var(--muted-foreground);font-size:13px" id="slotsLabel">—</span>
            </div>
            <div class="stepper">
              <button id="decSlot" aria-label="Fewer concurrent downloads" title="Fewer concurrent downloads">−</button>
              <span class="mono" id="slotCount">3</span>
              <button id="incSlot" aria-label="More concurrent downloads" title="More concurrent downloads">+</button>
            </div>
          </div>
          <div class="sysrow"><span>Disk</span><div class="diskbar"><i id="diskBar" style="width:0%"></i></div><b class="mono" id="diskLabel">—</b></div>
          <div class="sysrow"><span>Chrome</span><span class="badge" id="chromeBadge">—</span></div>
          <p id="chromeText"></p>
        </section>
      </div>

      <div class="toolbar" id="downloadsToolbar">
        <div class="pills" id="filters"></div>
        <div class="tools-right">
          <div class="search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input class="input" id="search" placeholder="Search downloads" aria-label="Search downloads">
          </div>
          <select class="input" id="sort" style="width:auto" aria-label="Sort by">
            <option value="added">Newest first</option>
            <option value="name">Name</option>
            <option value="size">Largest</option>
            <option value="speed">Fastest</option>
            <option value="progress">Progress</option>
          </select>
        </div>
      </div>

      <div class="bulkbar hidden" id="bulkbar">
        <span class="cb" role="checkbox" id="selectAllCb" data-bulk="all" tabindex="0" aria-label="Select all"><i class="checkbox"></i></span>
        <b id="bulkCount">Select all</b>
        <div class="tb-sep"></div>
        <button class="btn btn-sm btn-ghost" data-bulk="resume">Resume</button>
        <button class="btn btn-sm btn-ghost" data-bulk="pause">Pause</button>
        <button class="btn btn-sm btn-ghost" data-bulk="retry">Retry</button>
        <button class="btn btn-sm btn-ghost" data-bulk="remove" style="color:var(--destructive)">Remove</button>
        <button class="btn btn-sm btn-ghost" style="margin-left:auto" data-bulk="clear">Clear selection</button>
      </div>

      <div class="list" id="list"></div>
    </div>

    <div id="library-view">
      <div class="lib-head"><div class="pills" id="libFilters"></div></div>
      <div class="lib-grid" id="libGrid"></div>
    </div>
  </div>

  <nav class="dock" aria-label="Actions">
    <button class="btn btn-primary" id="addBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Add download
    </button>
    <div class="view-nav" id="viewNav">
      <button class="view-btn" data-view="downloads" id="navDownloads" aria-current="true">Downloads <span class="count" id="navCountDownloads">0</span></button>
      <button class="view-btn" data-view="library" id="navLibrary" aria-current="false">Library <span class="count" id="navCountLibrary">0</span></button>
    </div>
    <span class="dock-sep"></span>
    <button class="btn btn-ghost" id="startAllBtn" title="Start all paused, queued and failed downloads">Start all</button>
    <button class="btn btn-ghost" id="pauseAllBtn">Pause all</button>
    <button class="btn btn-ghost" id="removeAllBtn" style="display:none" title="Remove all completed downloads">Clear done</button>
    <span class="dock-sep"></span>
    <button class="btn btn-ghost btn-icon" id="helpBtn" title="Keyboard shortcuts" aria-label="Keyboard shortcuts">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg>
    </button>
    <button class="btn btn-ghost btn-icon" id="themeBtn" title="Toggle appearance" aria-label="Toggle appearance">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="btn btn-ghost btn-icon" id="settingsBtn" title="Settings" aria-label="Settings">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </nav>

  <aside class="sheet hidden" id="sheet" aria-label="Download details"></aside>
</div>

<div class="toasts" id="toasts"></div>
<div id="overlays"></div>
<div class="dropzone hidden" id="dropzone"><div>Drop a link to download it</div></div>

<script>
"use strict";
const TOKEN = "__FLOWDOWNLOAD_TOKEN__";
const APP_VERSION = "__FLOWDOWNLOAD_VERSION__";
const KB=1024, MB=KB*1024, GB=MB*1024;
// The reveal action's wording follows the OS's own file manager.
const FILE_MANAGER=/Mac/.test(navigator.platform)?"Finder":/Win/.test(navigator.platform)?"File Explorer":"file manager";
const REVEAL_LABEL="Show in "+FILE_MANAGER;

/* ---------- API ---------- */
async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({"Authorization":"Bearer "+TOKEN}, opts.headers||{});
  if(opts.body !== undefined) headers["Content-Type"] = "application/json";
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  if(!res.ok){
    let detail = res.statusText;
    try{ const j = await res.json(); if(j && j.detail) detail = j.detail; }catch(_){}
    throw new Error(detail);
  }
  const ct = res.headers.get("content-type")||"";
  return ct.includes("application/json") ? res.json() : null;
}
const getJSON = (path)=>api(path);
const post = (path, body)=>api(path, {method:"POST", body: body!==undefined?JSON.stringify(body):undefined});
const patch = (path, body)=>api(path, {method:"PATCH", body:JSON.stringify(body)});
const del = (path)=>api(path, {method:"DELETE"});

/* ---------- state ---------- */
let downloads = [];
let settingsCache = {download_dir:"~/Downloads", max_concurrent_downloads:3, notifications_enabled:true, minimize_to_tray:false, duplicate_policy:"rename",
  theme:(()=>{ try{ return localStorage.getItem("fd-theme")||"system"; }catch(_){ return "system"; } })()};
let diskCache = null;
let chromeCache = null;
let sheetLog = {id:null, entries:[]};
const ui={filter:"all", query:"", sort:"added", selected:new Set(), activeId:null, tab:"overview", wsConnected:false, view:"downloads", libFilter:"all"};
const thumbCache=new Map(); // id -> dataURL
const LIBRARY_EXTENSIONS=["mp4","mov","webm","mkv","avi","vid","m4v","mpg","mpeg","mp3","wav","aac","m4a","flac","ogg","opus","m4b"];
// Slot bounds: shared by the toolbar +/- buttons and the Settings dialog so
// the cap never drifts between entry points.
const SLOT_MIN=1, SLOT_MAX=50;
const VIDEO_EXTENSIONS=["mp4","mov","webm","mkv","avi","vid","m4v","mpg","mpeg"];
const AUDIO_EXTENSIONS=["mp3","wav","aac","m4a","flac","ogg","opus","m4b"];

const kindOf = n => {
  const e=(n.split(".").pop()||"").toLowerCase();
  if(VIDEO_EXTENSIONS.includes(e)) return "video";
  if(["zip","dmg","tar","gz","7z","pkg","iso"].includes(e)) return "archive";
  if(["png","jpg","jpeg","gif","webp","svg","heic"].includes(e)) return "image";
  return "file";
};
const extOf = n => (n.split(".").pop()||"?").toUpperCase().slice(0,4);
function hostOf(url){ try{ return new URL(url).hostname; }catch(_){ return url; } }
function guessFilename(url){ try{ const p=decodeURIComponent(new URL(url).pathname); return p.split("/").filter(Boolean).pop()||"download"; }catch(_){ return "download"; } }

function normalize(t){
  return {
    id:t.id, name:t.filename || t.dest_path.split("/").pop(), host:hostOf(t.url), url:t.url, dest:t.dest_path,
    size:t.total_bytes, received:t.downloaded_bytes, speedBps:t.speed_bps, state:t.status,
    error:t.error_message || null, etag:t.etag, lastModified:t.last_modified,
    referrer:t.referrer||"", connections:t.connections||0, segments:t.segments||[], hasCookie:t.has_cookie, acceptRanges:t.accept_ranges, added:t.created_at*1000, updatedAt:t.updated_at*1000
  };
}
function upsert(raw){
  const n=normalize(raw);
  const i=downloads.findIndex(x=>x.id===n.id);
  if(i>=0) downloads[i]=n; else downloads.unshift(n);
}

/* ---------- library helpers ---------- */
function isMediaDownload(d){
  if(d.state !== "completed") return false;
  const ext = (d.name.split(".").pop() || "").toLowerCase();
  return LIBRARY_EXTENSIONS.includes(ext);
}
function isVideoDownload(d){
  const ext = (d.name.split(".").pop() || "").toLowerCase();
  return VIDEO_EXTENSIONS.includes(ext);
}
function isAudioDownload(d){
  const ext = (d.name.split(".").pop() || "").toLowerCase();
  return AUDIO_EXTENSIONS.includes(ext);
}
function libVisible(filter){
  filter = filter || ui.libFilter;
  return downloads.filter(d=>isMediaDownload(d) && (
    filter==="all" ||
    (filter==="video" && isVideoDownload(d)) ||
    (filter==="audio" && isAudioDownload(d))
  ));
}

/* ---------- thumbnail extraction ---------- */
const _thumbVideos=new Map(); // id -> video element
async function extractThumbnail(d){
  if(thumbCache.has(d.id)) return thumbCache.get(d.id);
  if(!isVideoDownload(d)) return null;
  const url="/api/downloads/"+d.id+"/stream";
  const v=document.createElement("video");
  v.crossOrigin="anonymous";
  v.preload="metadata";
  v.muted=true;
  v.src=url;
  _thumbVideos.set(d.id, v);
  return new Promise((resolve)=>{
    const timeout=setTimeout(()=>{
      _thumbVideos.delete(d.id); v.src=""; resolve(null);
    },4000);
    v.addEventListener("loadeddata",()=>{ v.currentTime=Math.min(1, v.duration*0.1); }, {once:true});
    v.addEventListener("seeked",()=>{
      clearTimeout(timeout);
      try{
        const c=document.createElement("canvas");
        c.width=v.videoWidth||320; c.height=v.videoHeight||180;
        const ctx=c.getContext("2d");
        ctx.drawImage(v,0,0,c.width,c.height);
        const url=c.toDataURL("image/jpeg",0.7);
        thumbCache.set(d.id,url); _thumbVideos.delete(d.id); v.src=""; resolve(url);
      }catch(e){ _thumbVideos.delete(d.id); v.src=""; resolve(null); }
    }, {once:true});
    v.addEventListener("error",()=>{ clearTimeout(timeout); _thumbVideos.delete(d.id); v.src=""; resolve(null); }, {once:true});
  });
}

/* ---------- format helpers ---------- */
const fmtBytes=b=>{ if(b<KB) return Math.round(b)+" B";
  if(b<MB) return (b/KB).toFixed(0)+" KB";
  if(b<GB) return (b/MB).toFixed(b<10*MB?1:0)+" MB";
  return (b/GB).toFixed(2)+" GB"; };
const fmtSpeed=b=>b<=0?"—":fmtBytes(b)+"/s";
const fmtEta=s=>{ if(!isFinite(s)||s<=0) return "—";
  if(s<60) return Math.round(s)+"s";
  if(s<3600) return Math.floor(s/60)+"m "+Math.round(s%60)+"s";
  return Math.floor(s/3600)+"h "+Math.round(s%3600/60)+"m"; };
const fmtTime=epochSec=>{ const d=new Date(epochSec*1000); return d.toTimeString().slice(0,8); };
// "Mon, Sep 2" or "Sep 2, 2025" depending on whether the year is current.
const fmtDate=ms=>{ const d=new Date(ms); const opts={month:"short",day:"numeric"}; if(d.getFullYear()!==new Date().getFullYear()) opts.year="numeric"; return d.toLocaleDateString(undefined,opts); };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=d=>d.size>0?Math.min(1,Math.max(0,d.received/d.size)):0;

/* ---------- toasts ---------- */
const ICONS={ok:'<path d="M20 6 9 17l-5-5"/>',warn:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>',err:'<circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'};
function toast(kind,title,desc){
  const el=document.createElement("div");
  el.className="toast"; el.dataset.kind=kind;
  el.innerHTML='<svg class="ti" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:none;margin-top:1px">'+ICONS[kind]+'</svg>'+
    '<div><div class="tt">'+esc(title)+'</div>'+(desc?'<div class="td">'+esc(desc)+'</div>':'')+'</div>';
  document.getElementById("toasts").appendChild(el);
  setTimeout(()=>{el.style.transition="opacity .2s,transform .2s";el.style.opacity="0";el.style.transform="translateX(12px)";setTimeout(()=>el.remove(),220)},4200);
}

/* ---------- sidebar ---------- */
function renderFilters(){
  const box=document.getElementById("filters");
  box.innerHTML=FILTERS.map(f=>{
    const n = f.id==="all" ? downloads.length : downloads.filter(d=>d.state===f.id).length;
    return '<button class="nav" data-filter="'+f.id+'" aria-current="'+(ui.filter===f.id)+'">'+
      '<i class="dot" style="background:'+(f.color||"var(--border)")+'"></i>'+
      esc(f.label)+'<span class="count">'+n+'</span></button>';
  }).join("");
  box.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{ui.filter=b.dataset.filter;render()});
}

function renderLibFilters(){
  const box=document.getElementById("libFilters");
  const items=[
    {id:"all", label:"All media"},
    {id:"video", label:"Videos"},
    {id:"audio", label:"Audio"},
  ];
  // Counts must be computed from the unfiltered media set; otherwise the
  // currently-active sub-filter zeros out the other two counts.
  const allMedia = downloads.filter(d => isMediaDownload(d));
  const countFor = id => id === "all" ? allMedia.length
    : allMedia.filter(d => id === "video" ? isVideoDownload(d) : isAudioDownload(d)).length;
  box.innerHTML=items.map(f=>{
    const n=countFor(f.id);
    return '<button class="nav" data-libfilter="'+f.id+'" aria-current="'+(ui.libFilter===f.id)+'">'+esc(f.label)+'<span class="count">'+n+'</span></button>';
  }).join("");
  box.querySelectorAll("[data-libfilter]").forEach(b=>b.onclick=(e)=>{
    e.preventDefault();
    e.stopPropagation();
    ui.libFilter=b.dataset.libfilter;
    renderLibFilters();
    renderLibrary();
  });
}

function renderViewNav(){
  const dlCount=downloads.length;
  const libCount=downloads.filter(d=>isMediaDownload(d)).length;
  document.getElementById("navCountDownloads").textContent=dlCount;
  document.getElementById("navCountLibrary").textContent=libCount;
  document.getElementById("navDownloads").setAttribute("aria-current", ui.view==="downloads");
  document.getElementById("navLibrary").setAttribute("aria-current", ui.view==="library");
}

function renderSystem(){
  const active = downloads.filter(d=>d.state==="downloading"||d.state==="retrying").length;
  const waiting = downloads.filter(d=>d.state==="queued").length;
  document.getElementById("slotsLabel").textContent = active+" of "+settingsCache.max_concurrent_downloads+" busy"+
    (waiting ? " · "+waiting+" waiting for a slot" : "");
  document.getElementById("slotCount").textContent = settingsCache.max_concurrent_downloads;
  // Show "Remove all" only when there's at least one completed download.
  // It's a one-click shortcut for the most common list-cleanup action --
  // separate from the bulk-bar Remove which only acts on the current selection.
  const completedCount = downloads.filter(d=>d.state==="completed").length;
  const removeAllBtn = document.getElementById("removeAllBtn");
  if(removeAllBtn){
    removeAllBtn.style.display = completedCount > 0 ? "" : "none";
    removeAllBtn.textContent = "Clear done ("+completedCount+")";
  }
  if(diskCache){
    document.getElementById("diskLabel").textContent = fmtBytes(diskCache.free_bytes)+" free";
    const usedPct = diskCache.total_bytes > 0
      ? Math.max(0, Math.min(100, 100 * (1 - diskCache.free_bytes / diskCache.total_bytes)))
      : 0;
    document.getElementById("diskBar").style.width = usedPct + "%";
  }
  const badge=document.getElementById("chromeBadge"), text=document.getElementById("chromeText");
  if(chromeCache){
    badge.textContent = chromeCache.host_registered ? "Set up" : "Not set up";
    badge.className = "badge badge-"+(chromeCache.host_registered ? "completed" : "failed");
    if(chromeCache.host_registered && chromeCache.last_profile_name){
      const ageSec = (Date.now()/1000) - (chromeCache.last_ping_time || 0);
      const stale = ageSec > 60;
      const known = chromeCache.all_known_profiles || {};
      const knownCount = Object.keys(known).length;
      const profilePart = knownCount > 1
        ? "Active: "+chromeCache.last_profile_name+" (+"+(knownCount-1)+" other"+(knownCount>2?"s":"")+")"
        : "Active: "+chromeCache.last_profile_name;
      text.textContent = profilePart + (stale ? " — last seen "+Math.round(ageSec/60)+" min ago" : "");
    } else if(chromeCache.host_registered){
      text.textContent = "Native host is registered, but no extension is reporting. Reload the extension in Chrome.";
    } else {
      text.textContent = "Not registered. Restart FlowDownload (from a source checkout, run scripts/setup_chrome_integration.py), then reload the extension.";
    }
  }
}

/* ---------- library player modal ---------- */
// The library modal IS the player. Clicking a media card opens this
// overlay; the <video>/<audio> element streams the file directly from
// the server. The server's /stream-webm endpoint transcodes H.264/AAC
// source on-the-fly to VP9/Opus (WebM) so Qt WebEngine's open-source
// FFmpeg can decode it. Files already in WebM/Opus/VP9 are passed
// through without transcoding.
function openLibPlayer(id){
  const d=downloads.find(x=>x.id===id); if(!d) return;
  const ext=(d.name.split(".").pop()||"").toLowerCase();
  const audioExts=["mp3","wav","aac","m4a","flac","ogg"];
  const isVideo=!audioExts.includes(ext);
  const isMedia=isVideo||audioExts.includes(ext);
  const tag=isVideo?"video":"audio";

  const box=document.getElementById("overlays");
  box.innerHTML='<div class="lib-player-scrim" id="libScrim">'+
    '<div class="lib-player-card">'+
      '<div class="lib-player-head">'+
        '<div class="ficon" data-kind="'+kindOf(d.name)+'">'+extOf(d.name)+'</div>'+
        '<div class="lib-player-info">'+
          '<div class="lib-player-name">'+esc(d.name)+'</div>'+
          '<div class="lib-player-host mono">'+esc(d.host)+'</div>'+
        '</div>'+
        '<button class="lib-player-close" id="libCloseBtn" aria-label="Close player">'+
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'+
        '</button>'+
      '</div>'+
      '<div class="lib-player-body">'+
        (isMedia
          ? '<div id="libPlayerWrap" style="position:relative;width:100%;min-height:200px;background:#000;border-radius:6px 6px 0 0;display:flex;align-items:center;justify-content:center">'+
              // The actual <video> or <audio> element. Hidden until the
              // stream is ready; the transcode overlay covers it during
              // first-play conversion. We do NOT use the native
              // `controls` attribute because Qt WebEngine's built-in
              // seek bar pulls from buffered TimeRanges, which can lag
              // the actual playback head with on-the-fly WebM.
              '<'+tag+' id="libMedia" autoplay playsinline style="width:100%;border-radius:6px 6px 0 0;background:#000;display:none;max-height:60vh">'+
              'Your browser does not support '+tag+' playback.'+
              '</'+tag+'>'+
              // First-play overlay: a "Transcoding..." message with a
              // progress bar. The <video> stays hidden behind this until
              // the server reports the transcode is done.
              '<div id="libTranscode" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#e6e8ec;font-size:13px">'+
                '<div class="spinner" style="width:18px;height:18px;border:2px solid #3a3f48;border-top-color:#7d8a9c;border-radius:50%;animation:spin 0.9s linear infinite"></div>'+
                '<div>Preparing video…</div>'+
                '<div class="lib-transcode-bar" style="width:60%;max-width:300px;height:6px;background:#1f2329;border-radius:3px;overflow:hidden">'+
                  '<i id="libTranscodeFill" style="display:block;width:0%;height:100%;background:linear-gradient(90deg,#5e8bff,#9d6bff);transition:width .3s"></i>'+
                '</div>'+
                '<div id="libTranscodePct" style="font-size:11px;color:#9ba3ae;font-variant-numeric:tabular-nums">0%</div>'+
              '</div>'+
            '</div>'+
            // Custom controls bar — rendered BELOW the media element so
            // the seek bar syncs with currentTime and lets the user
            // click anywhere to seek, mute/unmute, play/pause, and
            // toggle fullscreen. Drawn from scratch because the native
            // controls are unreliable with FFmpeg-transcoded WebM.
            '<div class="lib-ctrl" id="libCtrl">'+
              '<button class="lib-ctrl-btn" id="libPlayBtn" aria-label="Play/Pause" title="Play / Pause (Space)">'+
                // Play icon (shown when paused). Swapped for a pause
                // glyph in the JS handler when the media starts.
                // Using a Unicode triangle here instead of an SVG so
                // there's no question of the icon rendering -- the
                // character is part of the font, and inherits color
                // directly.
                '<span id="libPlayIcon" style="font-size:18px;line-height:1;color:#fff">▶</span>'+
              '</button>'+
              '<span class="lib-ctrl-time" id="libTime">0:00 / 0:00</span>'+
              '<input class="lib-ctrl-seek" id="libSeek" type="range" min="0" max="100" step="0.01" value="0" aria-label="Seek" />'+
              '<button class="lib-ctrl-btn" id="libMuteBtn" aria-label="Mute" title="Mute / Unmute (M)">'+
                // Speaker icon (volume on). Replaced by muted icon
                // when toggled.
                '<span id="libVolumeIcon" style="font-size:18px;line-height:1;color:#fff">🔊</span>'+
              '</button>'+
              '<input class="lib-ctrl-volume" id="libVolume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume" />'+
              (isVideo
                ? '<button class="lib-ctrl-btn" id="libFsBtn" aria-label="Fullscreen" title="Fullscreen (F)">'+
                    '<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>'+
                  '</button>'
                : '')+
            '</div>'
          : '<div class="lib-player-no-preview">'+
              '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'+
              '<p>No in-app preview for this file type.</p>'+
            '</div>')+
      '</div>'+
      '<div class="lib-player-foot">'+
        '<button class="btn btn-outline btn-sm" data-act="reveal" data-id="'+esc(d.id)+'">'+
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>'+
          REVEAL_LABEL+
        '</button>'+
        '<button class="btn btn-outline btn-sm" data-act="copy" data-id="'+esc(d.id)+'">Copy link</button>'+
        '<button class="btn btn-ghost btn-sm" id="libDetailsBtn">View details</button>'+
      '</div>'+
    '</div>'+
  '</div>';

  document.getElementById("libCloseBtn").onclick=closeLibPlayer;
  document.getElementById("libScrim").addEventListener("click",e=>{ if(e.target.id==="libScrim") closeLibPlayer(); });
  document.querySelectorAll(".lib-player-foot [data-act]").forEach(b=>b.onclick=()=>act(b.dataset.id,b.dataset.act));
  document.getElementById("libDetailsBtn").onclick=()=>{ closeLibPlayer(); ui.activeId=id; ui.tab="overview"; setView("downloads"); render(); };

  if(!isMedia) return;

  // Capture references to the custom controls up front so we can
  // wire them up immediately. Without this, the buttons only become
  // functional after startPlayback() runs (i.e., after the first
  // transcode completes) -- which means clicking play/pause/mute
  // while the spinner is up does nothing.
  const mediaEl=document.getElementById("libMedia");
  const overlay=document.getElementById("libTranscode");
  const fill=document.getElementById("libTranscodeFill");
  const pctEl=document.getElementById("libTranscodePct");
  const ctrl=document.getElementById("libCtrl");
  const playBtn=document.getElementById("libPlayBtn");
  const playIcon=document.getElementById("libPlayIcon");
  const seekEl=document.getElementById("libSeek");
  const timeEl=document.getElementById("libTime");
  const muteBtn=document.getElementById("libMuteBtn");
  const volEl=document.getElementById("libVolume");
  const volIcon=document.getElementById("libVolumeIcon");
  const fsBtn=document.getElementById("libFsBtn");
  const streamUrl="/api/downloads/"+encodeURIComponent(id)+"/stream-webm";
  const statusUrl="/api/downloads/"+encodeURIComponent(id)+"/transcode-status";
  let pollTimer=null;
  let seeking=false;  // user is dragging the seek thumb — pause timeupdate
  // Set by closeLibPlayer (via ctrl._teardown). The status poll outlives
  // the modal otherwise -- and once the transcode finished it started
  // playback on the detached <video>: audio with no player on screen.
  let closed=false;

  function showProblem(message){
    if(!overlay) return;
    mediaEl.style.display="none";
    overlay.style.display="flex";
    const text=document.createElement("div");
    text.style.cssText="max-width:340px;text-align:center;line-height:1.5";
    text.textContent=message;
    overlay.replaceChildren(text);
  }

  // Unicode glyphs swapped in place when toggling play/pause and
  // mute/unmute. We use plain text characters rather than <svg>
  // so there's no question of the icon rendering: these characters
  // are part of the system font and inherit color from CSS.
  const ICON={
    play:"▶",   // U+25B6 BLACK RIGHT-POINTING TRIANGLE
    pause:"❚❚", // U+275A HEAVY VERTICAL BAR × 2
    volOn:"🔊", // U+1F50A SPEAKER WITH THREE SOUND WAVES
    volMute:"🔇", // U+1F507 SPEAKER WITH CANCELLATION STROKE
  };

  function fmt(t){
    if(!isFinite(t)||t<0) t=0;
    const m=Math.floor(t/60), s=Math.floor(t%60);
    return m+":"+(s<10?"0":"")+s;
  }

  function syncTime(){
    if(seeking) return;
    const dur=mediaEl.duration;
    const cur=mediaEl.currentTime;
    // Update the gradient fill via the CSS var the ::-webkit-slider-runnable-track
    // background reads. This drives the visual progress without
    // re-rendering anything else.
    const pct=(dur>0 && isFinite(dur)) ? (cur/dur)*100 : 0;
    seekEl.value=pct;
    seekEl.style.setProperty("--seek-pct", pct+"%");
    timeEl.textContent=fmt(cur)+" / "+fmt(dur);
  }

  function setPlayIcon(playing){
    playIcon.textContent=playing ? ICON.pause : ICON.play;
    playBtn.setAttribute("aria-label", playing?"Pause":"Play");
  }

  function setVolIcon(muted){
    volIcon.textContent=muted ? ICON.volMute : ICON.volOn;
    muteBtn.setAttribute("aria-label", muted?"Unmute":"Mute");
  }

  // --- Wire the custom controls up front, BEFORE the video is ready.
  // The buttons exist in the DOM as soon as the modal is opened;
  // attaching click handlers here means the user can mute / scrub
  // / fullscreen even while the first-play transcode is in progress.
  playBtn.onclick=()=>{
    if(mediaEl.src){
      if(mediaEl.paused) mediaEl.play().catch(()=>{});
      else mediaEl.pause();
    }
  };
  seekEl.addEventListener("input",()=>{
    seeking=true;
    const dur=mediaEl.duration;
    if(dur>0 && isFinite(dur)){
      const t=(parseFloat(seekEl.value)/100)*dur;
      timeEl.textContent=fmt(t)+" / "+fmt(dur);
      seekEl.style.setProperty("--seek-pct", seekEl.value+"%");
    }
  });
  seekEl.addEventListener("change",()=>{
    const dur=mediaEl.duration;
    if(dur>0 && isFinite(dur)){
      mediaEl.currentTime=(parseFloat(seekEl.value)/100)*dur;
    }
    seeking=false;
  });
  // Cancel `seeking` if the user lets go of the thumb anywhere
  // off the document, or if focus is lost mid-drag.
  const stopSeeking=()=>{ seeking=false; };
  window.addEventListener("mouseup", stopSeeking);
  window.addEventListener("blur", stopSeeking);

  muteBtn.onclick=()=>{
    mediaEl.muted=!mediaEl.muted;
    setVolIcon(mediaEl.muted);
  };
  volEl.addEventListener("input",()=>{
    mediaEl.volume=parseFloat(volEl.value);
    if(mediaEl.volume>0 && mediaEl.muted){
      mediaEl.muted=false;
      setVolIcon(false);
    } else if(mediaEl.volume===0 && !mediaEl.muted){
      mediaEl.muted=true;
      setVolIcon(true);
    }
  });
  if(fsBtn){
    fsBtn.onclick=()=>{
      const wrap=document.getElementById("libPlayerWrap");
      if(!wrap) return;
      if(document.fullscreenElement) document.exitFullscreen();
      else if(wrap.requestFullscreen) wrap.requestFullscreen();
    };
  }

  // Keyboard shortcuts: Space toggles play/pause, M toggles mute, F
  // toggles fullscreen. Ignore when an input is focused so we don't
  // hijack typing in the rest of the app.
  const onKey=(e)=>{
    const t=e.target;
    if(t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA")) return;
    if(e.key===" "){ e.preventDefault(); playBtn.click(); }
    else if(e.key==="m"||e.key==="M"){ e.preventDefault(); muteBtn.click(); }
    else if((e.key==="f"||e.key==="F") && fsBtn){ e.preventDefault(); fsBtn.click(); }
  };
  window.addEventListener("keydown", onKey);
  if(ctrl) ctrl._teardown=()=>{
    closed=true;
    if(pollTimer){ clearTimeout(pollTimer); pollTimer=null; }
    window.removeEventListener("keydown", onKey);
    window.removeEventListener("mouseup", stopSeeking);
    window.removeEventListener("blur", stopSeeking);
  };

  // Two paths to get the WebM:
  //   1. Cache hit (state=cached in /transcode-status): assign the
  //      stream URL directly to <video> and play.
  //   2. Cache miss: poll /transcode-status which kicks off the
  //      transcode AND reports percent. When state="cached", assign
  //      the same URL to <video> for instant playback.
  // In both cases the file is on disk before the <video> element starts
  // loading, so the WebM header (including the duration) is valid and
  // the seek bar renders correctly.

  function startPlayback(){
    if(pollTimer){clearTimeout(pollTimer); pollTimer=null;}
    if(closed) return;
    mediaEl.onerror=()=>{
      const e=mediaEl.error;
      console.warn("[libPlayer] media error code="+(e?e.code:"null")+" msg="+(e&&e.message));
      showProblem("This file can't be played here. Use "+REVEAL_LABEL+" to open it in another app.");
    };
    mediaEl.style.display="block";
    if(overlay) overlay.style.display="none";
    mediaEl.src=streamUrl;
    mediaEl.load();

    // The custom-controls click handlers (play/pause/mute/volume/
    // fullscreen/seek + keyboard shortcuts) are wired at modal-open
    // time above so the user can interact with them even before the
    // first-play transcode completes. Here we only need to attach
    // the *media element* events that drive the bar from the
    // playback head: timeupdate (4×/s while playing), loadedmetadata
    // (so the duration is shown as soon as the WebM header parses),
    // durationchange (rare but covers live streams), play/pause (to
    // swap the play button glyph), and ended (to reset the icon).
    const onPlay=()=>setPlayIcon(true);
    const onPause=()=>setPlayIcon(false);
    const onLoaded=()=>{
      syncTime();
      // Resume if autoplay was blocked.
      mediaEl.play().catch(()=>{});
    };
    mediaEl.addEventListener("play", onPlay);
    mediaEl.addEventListener("pause", onPause);
    mediaEl.addEventListener("timeupdate", syncTime);
    mediaEl.addEventListener("loadedmetadata", onLoaded);
    mediaEl.addEventListener("durationchange", syncTime);
    mediaEl.addEventListener("ended", ()=>{ syncTime(); setPlayIcon(false); });
  }

  function pollTranscodeStatus(){
    if(closed) return;
    fetch(statusUrl,{headers:{"Authorization":"Bearer "+TOKEN}})
      .then(r=>r.ok ? r.json() : Promise.reject(new Error("HTTP "+r.status)))
      .then(s=>{
        if(closed) return;
        if(s.state==="cached"){
          startPlayback();
          return;
        }
        if(s.state==="failed"){ showProblem(s.error||"This file couldn't be prepared for preview."); return; }
        // pending or transcoding -- show whatever progress we have
        // and keep polling. 1% is the floor so the bar animates
        // even before any bytes are written.
        const pct=s.percent!=null ? s.percent : 1;
        if(fill) fill.style.width=pct+"%";
        if(pctEl) pctEl.textContent=pct+"%";
        pollTimer=setTimeout(pollTranscodeStatus, 1000);
      })
      .catch(err=>{
        console.warn("[libPlayer] status poll failed:", err);
        if(!closed) pollTimer=setTimeout(pollTranscodeStatus, 2000);
      });
  }

  // Always start by polling the status endpoint. It tells us if the
  // cache is ready (instant play) and starts the transcode if not.
  // No need for a separate HEAD probe.
  pollTranscodeStatus();
}

function closeLibPlayer(){
  // Pause and release the media element so the FFmpeg subprocess on the
  // server side sees the client disconnect and tears down cleanly.
  const m=document.getElementById("libMedia");
  if(m){ m.pause(); m.removeAttribute("src"); m.load(); }
  // Stop the transcode poll and drop the window listeners openLibPlayer
  // attached, so nothing fires on (or starts playing) a stale modal.
  const ctrl=document.getElementById("libCtrl");
  if(ctrl && ctrl._teardown) ctrl._teardown();
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  const s=document.getElementById("libScrim");
  if(s){ s.style.opacity="0";s.style.transition="opacity .15s";setTimeout(()=>s.remove(),160); }
}

function visible(){
  let out=downloads.filter(d=>ui.filter==="all"||d.state===ui.filter);
  if(ui.query){ const q=ui.query.toLowerCase();
    out=out.filter(d=>d.name.toLowerCase().includes(q)||d.host.toLowerCase().includes(q)); }
  const s=ui.sort;
  out.sort((a,b)=> s==="name"?a.name.localeCompare(b.name)
    : s==="size"?b.size-a.size
    : s==="speed"?b.speedBps-a.speedBps
    : s==="progress"?pct(b)-pct(a)
    : b.added-a.added);
  return out;
}

// Same grouping as _domain_key in app/engine/manager.py: last two hostname
// labels, or the whole host for an IP literal.
function domainKey(url){
  let h; try{ h=new URL(url).hostname.toLowerCase(); }catch(_){ return url; }
  if(/^[\d.]+$/.test(h) || h.startsWith("[")) return h;
  return h.split(".").slice(-2).join(".");
}

// Why a queued download hasn't started. Computed on every render rather
// than sent by the server: it depends on *other* downloads, which change
// without this row receiving an update of its own.
function waitReason(d){
  if(d.state!=="queued") return "";
  const active=downloads.filter(x=>x.state==="downloading"||x.state==="retrying");
  if(active.length>=settingsCache.max_concurrent_downloads) return "Waiting for a free slot";
  // The per-site limit is a connection budget: a split-file download
  // holds several of its connections.
  const lim=settingsCache.site_connection_limit, key=domainKey(d.url);
  const used=active.filter(x=>domainKey(x.url)===key).reduce((n,x)=>n+Math.max(1,x.connections||1),0);
  if(lim && used>=lim)
    return "Waiting — site connection limit ("+lim+") reached for "+key;
  return "";
}

// 403/410 on a download that used to work usually means a signed link expired.
const looksExpired = d => d.state==="failed" && /\b(403|410)\b/.test(d.error||"");

function rbotHTML(d){
  if((d.state==="failed"||d.state==="retrying") && d.error)
    return '<span class="rerr" style="color:'+(d.state==="failed"?"var(--destructive)":"var(--warning)")+'">'+esc(d.error)+'</span>'+
      (looksExpired(d)?'<span class="sep">·</span><span>Link may have expired — right-click → Refresh link</span>':'');
  const showWarnAcceptRanges = ["downloading","retrying","paused"].includes(d.state) && d.size>0 && !d.acceptRanges;
  const reason = waitReason(d);
  return '<span class="mono">'+fmtBytes(d.received)+' of '+fmtBytes(d.size)+'</span>'+
    '<span class="sep">·</span><span>'+Math.round(pct(d)*100)+'%</span>'+
    (showWarnAcceptRanges?'<span class="sep">·</span><span style="color:var(--warning)">no resume</span>':'')+
    (reason?'<span class="sep">·</span><span>'+esc(reason)+'</span>':'');
}

function segbarHTML(d){
  const p = pct(d);
  const w = isFinite(p) ? p*100 : 0;
  return '<div class="segbar" data-state="'+d.state+'" role="progressbar" aria-valuenow="'+Math.round(w)+'" aria-valuemin="0" aria-valuemax="100">'+
    '<i style="width:'+w+'%"></i></div>';
}

// Speed and time left -- the card's badge already says which state it's in,
// and .rbot carries the bytes, errors and wait reasons.
function rowMeta(d){
  if(d.state==="completed") return '<span class="reta">'+fmtBytes(d.size)+'</span>';
  if(d.state!=="downloading") return '';
  const etaText = d.speedBps > 0 ? fmtEta((d.size-d.received)/d.speedBps)+' left' : '—';
  return '<span class="rspeed">'+fmtSpeed(d.speedBps)+'</span><span class="reta">'+etaText+'</span>';
}

// Progress rings. A split download's ring is its real file map: one arc per
// piece at that piece's byte range, filled as far as it has got (pieces
// split while downloading just show up as more arcs). Single-stream
// downloads get one arc for the whole file.
function ringColor(d){
  if(d.state==="failed") return "var(--destructive)";
  if(d.state==="downloading"||d.state==="completed") return "var(--foreground)";
  if(d.state==="retrying") return "var(--dot-busy)";
  return "var(--dot-idle)";
}
function ringBG(d){
  const color=ringColor(d), track="var(--track)";
  const pieces = (d.segments && d.segments.length && d.size>0 && d.state!=="completed")
    ? d.segments.map(([start,done,end])=>[start/d.size, done/(end-start+1), (end+1)/d.size])
    : [[0, d.state==="completed"?1:pct(d), 1]];
  const gap = pieces.length>1 ? 1.2 : 0;  // degrees between neighbouring pieces
  const stops=[];
  pieces.forEach(([a,fill,b])=>{
    const s=a*360, e=b*360, s2=s+gap/2, e2=Math.max(s2,e-gap/2);
    const f=s2+(e2-s2)*Math.max(0,Math.min(1,fill));
    stops.push("transparent "+s+"deg "+s2+"deg", color+" "+s2+"deg "+f+"deg", track+" "+f+"deg "+e2+"deg", "transparent "+e2+"deg "+e+"deg");
  });
  return "conic-gradient("+stops.join(",")+")";
}
function miniRingHTML(d){
  return '<div class="mring" role="img" aria-label="'+Math.round(pct(d)*100)+'% downloaded" style="background:'+ringBG(d)+'"><span>'+
    (d.state==="completed"?"✓":Math.round(pct(d)*100))+'</span></div>';
}

// The top card: the download most worth watching -- the fastest one running,
// else the first that's retrying, waiting or paused.
function heroDownload(){
  const rank={downloading:0,retrying:1,queued:2,paused:3};
  return downloads.filter(d=>d.state in rank)
    .sort((a,b)=>rank[a.state]-rank[b.state] || b.speedBps-a.speedBps || b.added-a.added)[0] || null;
}
function renderHero(){
  const box=document.getElementById("hero");
  const d=heroDownload();
  if(!d){
    box.dataset.id="";
    box.innerHTML='<div class="hero-idle"><h2>Nothing downloading</h2>'+
      '<p>Downloads you start in Chrome show up here, or add a link with <b>Add download</b> below.</p></div>';
    return;
  }
  const running=d.state==="downloading"||d.state==="retrying";
  const split=!!(d.segments&&d.segments.length);
  const pieces=split ? String(d.segments.length) : (running ? String(Math.max(1,d.connections||1)) : "—");
  const eta=d.state==="downloading"&&d.speedBps>0 ? fmtEta((d.size-d.received)/d.speedBps) : "—";
  const pctText=String(Math.round(pct(d)*100));
  // Same download, same state: update the numbers in place. Rebuilding on
  // every progress tick (~4/s) would drop keyboard focus from its buttons.
  if(box.dataset.id===d.id && box.dataset.state===d.state){
    const ring=box.querySelector(".hring");
    ring.style.background=ringBG(d);
    ring.setAttribute("aria-label", pctText+"% of "+d.name+" downloaded");
    box.querySelector("#heroPct").textContent=pctText;
    box.querySelector("#heroBytes").textContent=fmtBytes(d.received)+" of "+fmtBytes(d.size);
    box.querySelector("#heroSpeed").textContent=fmtSpeed(d.speedBps);
    box.querySelector("#heroEta").textContent=eta;
    box.querySelector("#heroPieces").textContent=pieces;
    box.querySelector("#heroPiecesLabel").textContent=split?"Pieces":"Connections";
    return;
  }
  box.dataset.id=d.id; box.dataset.state=d.state;
  box.innerHTML=
    '<div class="hring" role="img" aria-label="'+pctText+'% of '+esc(d.name)+' downloaded" style="background:'+ringBG(d)+'">'+
      '<div class="hole"><span class="num"><span id="heroPct">'+pctText+'</span><small>%</small></span>'+
      '<span class="mono" id="heroBytes" style="font-size:12px;color:var(--muted-foreground)">'+fmtBytes(d.received)+' of '+fmtBytes(d.size)+'</span></div></div>'+
    '<div class="hero-main">'+
      '<div style="display:flex;align-items:center;gap:12px"><div class="ficon">'+extOf(d.name)+'</div>'+
        '<span class="badge badge-'+d.state+'">'+d.state[0].toUpperCase()+d.state.slice(1)+'</span></div>'+
      '<h2>'+esc(d.name)+'</h2>'+
      '<div class="hero-host mono">'+esc(d.host)+'</div>'+
      '<div class="stats3"><div><span>Speed</span><span class="mono" id="heroSpeed">'+fmtSpeed(d.speedBps)+'</span></div>'+
        '<div><span>Left</span><span class="mono" id="heroEta">'+eta+'</span></div>'+
        '<div><span id="heroPiecesLabel">'+(split?"Pieces":"Connections")+'</span><span class="mono" id="heroPieces">'+pieces+'</span></div></div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
        (running?'<button class="btn btn-primary" data-act="pause" data-id="'+d.id+'">Pause</button>'
                :'<button class="btn btn-primary" data-act="resume" data-id="'+d.id+'">Resume</button>')+
        '<button class="btn btn-outline" data-act="details" data-id="'+d.id+'">Details</button>'+
      '</div>'+
    '</div>';
}

// Total speed, sampled every 3 s: 20 bars = the last minute.

/* ---------- detail sheet ---------- */
function buildTimeline(entries){
  if(entries.length<2) return null;
  const start=entries[0].time, end=entries[entries.length-1].time;
  const total=Math.max(end-start,1);
  let bars="";
  for(let i=0;i<entries.length-1;i++){
    const seg=entries[i];
    const w=(entries[i+1].time-seg.time)/total*100;
    const t = seg.level==="warn" ? "wait" : seg.level==="error" ? "stall" : "ok";
    bars+='<i data-t="'+t+'" style="left:'+(entries.slice(0,i).reduce((a,e,j)=>a+(entries[j+1].time-e.time)/total*100,0))+'%;width:'+w+'%"></i>';
  }
  return bars;
}

function renderSheet(){
  const sheet=document.getElementById("sheet");
  const d=downloads.find(x=>x.id===ui.activeId);
  if(!d){ sheet.classList.add("hidden"); return; }

      '<dt>Connections</dt><dd class="mono">'+((d.state==="downloading"||d.state==="retrying") && d.connections ? d.connections : "—")+'</dd>'+
      '<dt>Time left</dt><dd class="mono">'+(d.state==="downloading" && d.speedBps>0 ? fmtEta((d.size-d.received)/d.speedBps) : "—")+'</dd>'+
      '<dt>Save to</dt><dd class="mono" style="font-size:10.5px">'+esc(d.dest)+'</dd>'+
      '<dt>Source</dt><dd class="mono" style="font-size:10.5px">'+esc(d.url)+'</dd>'+
      '<dt>Referrer</dt><dd class="mono" style="font-size:10.5px">'+(d.referrer?esc(d.referrer):"none")+'</dd>'+
    '</dl><div class="hr"></div><div class="sect">Resume support</div><dl class="kv">'+
      '<dt>Accept-Ranges</dt><dd>'+(d.acceptRanges?'<span style="color:var(--success)">bytes — resumable</span>':'<span style="color:var(--warning)">not confirmed yet — may restart on failure</span>')+'</dd>'+
      '<dt>ETag</dt><dd class="mono" style="font-size:10.5px">'+esc(d.etag||"none")+'</dd>'+
      '<dt>Validator</dt><dd>If-Range checked on every resume</dd>'+

      (d.state==="completed"?'<button class="btn btn-outline btn-sm" data-act="reveal" data-id="'+d.id+'">'+FOLDER+' '+REVEAL_LABEL+'</button>':'')+
      (isMediaDownload(d)?'<button class="btn btn-primary btn-sm" data-act="play" data-id="'+d.id+'">'+PLAY+' Preview</button>':'')+
      '<button class="btn btn-ghost btn-sm" data-act="copy" data-id="'+d.id+'">Copy link</button>'+
    '</div></div>'+
    '<div class="tabs" role="tablist">'+tabs.map(t=>'<button class="tab" role="tab" data-tab="'+t+'" aria-selected="'+(ui.tab===t)+'">'+t[0].toUpperCase()+t.slice(1)+'</button>').join("")+'</div>'+
    '<div class="sheet-body">'+body+'</div>';

  sheet.querySelector("#closeSheet").onclick=()=>{ui.activeId=null;render()};
  sheet.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;renderSheet()});
