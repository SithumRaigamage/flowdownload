<!DOCTYPE html>
<html lang="en" class="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowDownload</title>
<script>try{ if(localStorage.getItem("fd-theme")==="dark") document.documentElement.classList.add("dark"); }catch(_){}</script>
<style>
/* ============================================================
   THEME TOKENS — shadcn/ui variable names.
   ============================================================ */
:root{
  --background: oklch(0.985 0.004 250);
  --foreground: oklch(0.26 0.021 258);
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.26 0.021 258);
  --popover: oklch(1 0 0);
  --popover-foreground: oklch(0.26 0.021 258);
  --primary: oklch(0.55 0.132 252);
  --primary-foreground: oklch(0.99 0.005 250);
  --secondary: oklch(0.962 0.009 252);
  --secondary-foreground: oklch(0.34 0.028 258);
  --muted: oklch(0.966 0.007 252);
  --muted-foreground: oklch(0.556 0.021 256);
  --accent: oklch(0.945 0.021 252);
  --accent-foreground: oklch(0.34 0.028 258);
  --destructive: oklch(0.58 0.196 27);
  --destructive-foreground: oklch(0.99 0.005 250);
  --success: oklch(0.62 0.135 155);
  --warning: oklch(0.72 0.145 68);
  --border: oklch(0.918 0.011 254);
  --input: oklch(0.918 0.011 254);
  --ring: oklch(0.55 0.132 252);
  --radius: 0.625rem;
  --shadow-sm: 0 1px 2px 0 oklch(0.26 0.021 258 / 0.06);
  --shadow-md: 0 4px 12px -2px oklch(0.26 0.021 258 / 0.10), 0 2px 4px -2px oklch(0.26 0.021 258 / 0.06);
  --shadow-lg: 0 16px 40px -8px oklch(0.26 0.021 258 / 0.20), 0 4px 12px -4px oklch(0.26 0.021 258 / 0.10);

  /* Glass morphism tokens */
  --glass-bg: color-mix(in oklab, var(--card) 78%, transparent);
  --glass-border: color-mix(in oklab, var(--border) 50%, transparent);
  --glass-highlight: color-mix(in oklab, #fff 8%, transparent);
  --glass-blur: 20px;
  --glass-saturate: 130%;

  /* Atmosphere blobs (light mode: subtle) */
  --blob1-x: 12%;
  --blob1-y: -8%;
  --blob1-color: color-mix(in oklab, var(--primary) 18%, transparent);
  --blob2-x: 100%;
  --blob2-y: 0%;
  --blob2-color: color-mix(in oklab, #6a4bff 14%, transparent);
  --blob3-x: 88%;
  --blob3-y: 110%;
  --blob3-color: color-mix(in oklab, var(--success) 8%, transparent);
}
.dark{
  --background: oklch(0.196 0.014 258);
  --foreground: oklch(0.945 0.007 250);
  --card: oklch(0.232 0.016 258);
  --card-foreground: oklch(0.945 0.007 250);
  --popover: oklch(0.245 0.017 258);
  --popover-foreground: oklch(0.945 0.007 250);
  --primary: oklch(0.685 0.128 250);
  --primary-foreground: oklch(0.18 0.016 258);
  --secondary: oklch(0.276 0.018 258);
  --secondary-foreground: oklch(0.92 0.008 250);
  --muted: oklch(0.276 0.018 258);
  --muted-foreground: oklch(0.68 0.017 254);
  --accent: oklch(0.312 0.024 256);
  --accent-foreground: oklch(0.945 0.007 250);
  --destructive: oklch(0.63 0.185 27);
  --destructive-foreground: oklch(0.98 0.005 250);
  --success: oklch(0.68 0.13 155);
  --warning: oklch(0.77 0.14 68);
  --border: oklch(0.318 0.02 258);
  --input: oklch(0.318 0.02 258);
  --ring: oklch(0.685 0.128 250);
  --shadow-sm: 0 1px 2px 0 oklch(0 0 0 / 0.30);
  --shadow-md: 0 4px 12px -2px oklch(0 0 0 / 0.40), 0 2px 4px -2px oklch(0 0 0 / 0.30);
  --shadow-lg: 0 16px 40px -8px oklch(0 0 0 / 0.55), 0 4px 12px -4px oklch(0 0 0 / 0.40);

  /* Dark glass: more opaque, more blur */
  --glass-bg: color-mix(in oklab, var(--card) 72%, transparent);
  --glass-border: color-mix(in oklab, var(--border) 45%, transparent);
  --glass-highlight: color-mix(in oklab, #fff 5%, transparent);

  /* Dark atmosphere: more saturated blobs */
  --blob1-color: color-mix(in oklab, var(--primary) 28%, transparent);
  --blob2-color: color-mix(in oklab, #6a4bff 22%, transparent);
  --blob3-color: color-mix(in oklab, var(--success) 14%, transparent);
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  /* Atmospheric background: three blurred colour blobs behind everything */
  background:
    radial-gradient(900px 600px at var(--blob1-x) var(--blob1-y), var(--blob1-color), transparent 65%),
    radial-gradient(800px 700px at var(--blob2-x) var(--blob2-y), var(--blob2-color), transparent 60%),
    radial-gradient(700px 500px at var(--blob3-x) var(--blob3-y), var(--blob3-color), transparent 65%),
    var(--background);
  background-attachment: fixed;
  color:var(--foreground);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  font-size:13px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
.mono{font-family:"SF Mono",ui-monospace,"JetBrains Mono","Menlo",monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted-foreground);border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- glass utility ---------- */
.glass{
  background:var(--glass-bg);
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate)) brightness(1.02);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate)) brightness(1.02);
  border:1px solid var(--glass-border);
  box-shadow:inset 0 1px 0 var(--glass-highlight), var(--shadow-md);
}

/* ---------- primitives ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;
  border-radius:calc(var(--radius) - 2px);border:1px solid transparent;
  font-size:12.5px;font-weight:500;white-space:nowrap;
  transition:background .13s,border-color .13s,color .13s,opacity .13s,transform .08s;
}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover:not(:disabled){filter:brightness(1.07)}
.btn-outline{border-color:var(--border);background:var(--card)}
.btn-outline:hover:not(:disabled){background:var(--accent)}
.btn-ghost:hover:not(:disabled){background:var(--accent)}
.btn-destructive{background:var(--destructive);color:var(--destructive-foreground)}
.btn-destructive:hover:not(:disabled){filter:brightness(1.07)}
.btn-icon{width:30px;padding:0;justify-content:center}
.btn-sm{height:26px;padding:0 9px;font-size:12px}

.badge{
  display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;
  border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.01em;
  border:1px solid transparent;
}
.badge-downloading{background:color-mix(in oklab,var(--primary) 14%,transparent);color:var(--primary);border-color:color-mix(in oklab,var(--primary) 26%,transparent)}
.badge-queued{background:var(--muted);color:var(--muted-foreground);border-color:var(--border)}
.badge-paused{background:var(--muted);color:var(--muted-foreground);border-color:var(--border)}
.badge-cancelled{background:var(--muted);color:var(--muted-foreground);border-color:var(--border)}
.badge-retrying{background:color-mix(in oklab,var(--warning) 16%,transparent);color:var(--warning);border-color:color-mix(in oklab,var(--warning) 30%,transparent)}
.badge-completed{background:color-mix(in oklab,var(--success) 14%,transparent);color:var(--success);border-color:color-mix(in oklab,var(--success) 28%,transparent)}
.badge-failed{background:color-mix(in oklab,var(--destructive) 13%,transparent);color:var(--destructive);border-color:color-mix(in oklab,var(--destructive) 28%,transparent)}

.input{
  height:30px;width:100%;padding:0 10px;border-radius:calc(var(--radius) - 2px);
  border:1px solid var(--input);background:var(--card);font-size:12.5px;
  transition:border-color .13s,box-shadow .13s;
}
.input:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 18%,transparent)}
.input::placeholder{color:var(--muted-foreground)}
.input[readonly]{color:var(--muted-foreground);cursor:default}
select.input{cursor:pointer;appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px;background-repeat:no-repeat}
.label{display:block;font-size:11.5px;font-weight:600;color:var(--muted-foreground);margin-bottom:5px;letter-spacing:.01em}

.switch{position:relative;width:34px;height:19px;border-radius:99px;background:var(--input);transition:background .16s;flex:none;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:99px;background:var(--card);box-shadow:var(--shadow-sm);transition:transform .16s}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(15px)}

.checkbox{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--input);background:var(--card);flex:none;display:grid;place-items:center;transition:background .12s,border-color .12s;pointer-events:none}
.checkbox[aria-checked="true"]{background:var(--primary);border-color:var(--primary)}
.checkbox[aria-checked="true"]::after{content:"";width:8px;height:5px;border:1.8px solid var(--primary-foreground);border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
.checkbox[data-indeterminate="true"]{background:var(--primary);border-color:var(--primary)}
.checkbox[data-indeterminate="true"]::after{content:"";width:8px;height:1.8px;border:none;background:var(--primary-foreground);transform:none}
.cb{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer}

.kbd{display:inline-block;min-width:17px;padding:1px 5px;border-radius:4px;border:1px solid var(--border);
  background:var(--muted);font-size:10.5px;font-family:"SF Mono",ui-monospace,monospace;color:var(--muted-foreground);text-align:center}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100vh}

.statusbar{
  display:flex;align-items:center;gap:12px;height:30px;padding:0 12px;flex:none;
  border-bottom:1px solid transparent;
}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.throughput{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted-foreground)}
.throughput b{color:var(--foreground);font-weight:600}
.netdot{width:6px;height:6px;border-radius:99px;background:var(--success);flex:none}
.netdot.off{background:var(--destructive)}

.body{display:flex;flex:1;min-height:0;position:relative}

/* ---------- sidebar ---------- */
.sidebar{
  width:216px;flex:none;display:flex;flex-direction:column;gap:2px;padding:10px 8px;
  border-right:1px solid transparent;
  overflow-y:auto;
  /* Extra shadow on the right edge so glass overlaps main content nicely */
  position:relative;z-index:5;
}
.side-label{font-size:10.5px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;color:var(--muted-foreground);padding:10px 8px 5px}

.view-nav{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}
.view-btn{
  display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:calc(var(--radius) - 2px);
  font-size:12.5px;font-weight:500;color:var(--secondary-foreground);width:100%;text-align:left;
  transition:background .12s,color .12s,box-shadow .12s;
}
.view-btn:hover{background:var(--accent)}
.view-btn[aria-current="true"]{
  background:color-mix(in oklab,var(--primary) 14%,transparent);
  color:var(--primary);
  box-shadow:inset 2px 0 0 var(--primary);
  font-weight:600;
}
.view-btn svg{color:var(--muted-foreground);flex:none}
.view-btn[aria-current="true"] svg{color:var(--primary)}
.view-btn .count{margin-left:auto;font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.view-btn[aria-current="true"] .count{color:var(--primary);opacity:.8}

.nav{display:flex;align-items:center;gap:9px;height:29px;padding:0 8px;border-radius:calc(var(--radius) - 2px);
  font-size:12.5px;font-weight:500;color:var(--secondary-foreground);width:100%;text-align:left;transition:background .12s,color .12s}
.nav:hover{background:var(--accent)}
.nav[aria-current="true"]{background:var(--accent);color:var(--accent-foreground);font-weight:600}
.nav .dot{width:7px;height:7px;border-radius:99px;flex:none}
.nav .count{margin-left:auto;font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.nav[aria-current="true"] .count{color:var(--accent-foreground)}

.side-card{margin:8px;padding:10px;border:1px solid transparent;border-radius:var(--radius)}
.side-card .row{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;margin-bottom:7px}
.side-card .row span{color:var(--muted-foreground)}
.diskbar{height:5px;border-radius:99px;background:var(--muted);overflow:hidden}
.diskbar i{display:block;height:100%;background:var(--primary);border-radius:99px}
.side-foot{margin-top:auto;padding:8px}
.app-version{padding:6px 12px 0;font-size:10.5px;color:var(--muted-foreground)}

/* ---------- toolbar ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.toolbar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid transparent;flex:none}
.search{position:relative;flex:1;max-width:300px}
.search .input{padding-left:29px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted-foreground);pointer-events:none}
.tb-sep{width:1px;height:19px;background:var(--border);margin:0 2px}

.bulkbar{display:flex;align-items:center;gap:8px;padding:7px 12px;
  border-bottom:1px solid transparent;font-size:12.5px;flex:none}
.bulkbar b{font-weight:600}
.bulkbar[data-has-selection="false"] [data-bulk]:not([data-bulk="all"]){pointer-events:none;opacity:.4}

/* ---------- list ---------- */
.list{flex:1;overflow-y:auto;padding:6px;position:relative}
.row{
  display:grid;grid-template-columns:auto auto 1fr auto;gap:11px;align-items:center;
  padding:9px 10px;border-radius:var(--radius);border:1px solid transparent;
  transition:background .12s,border-color .12s,box-shadow .12s,transform .08s;cursor:default;position:relative;
}
.row:hover:not([data-selected="true"]){
  background:color-mix(in oklab, var(--card) 55%, transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-color:var(--glass-border);
}
.row[data-selected="true"]{
  background:color-mix(in oklab,var(--primary) 9%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-color:color-mix(in oklab,var(--primary) 32%,transparent);
}
.row[data-selected="true"]:hover{
  background:color-mix(in oklab,var(--primary) 13%,transparent);
  border-color:color-mix(in oklab,var(--primary) 38%,transparent);
}
.row[data-active="true"]{box-shadow:inset 2px 0 0 var(--primary)}
.row:active{transform:scale(0.995)}
.row .cb{opacity:0;transition:opacity .12s}
.row:hover .cb,.row[data-selected="true"] .cb,.list[data-anyselected="true"] .cb,.row:focus-within .cb{opacity:1}

.ficon{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;
  font-size:9.5px;font-weight:700;letter-spacing:.02em;
  background:var(--muted);color:var(--muted-foreground);border:1px solid var(--border)}
.ficon[data-kind="video"]{background:color-mix(in oklab,var(--primary) 13%,transparent);color:var(--primary);border-color:transparent}
.ficon[data-kind="archive"]{background:color-mix(in oklab,var(--warning) 15%,transparent);color:var(--warning);border-color:transparent}
.ficon[data-kind="image"]{background:color-mix(in oklab,var(--success) 14%,transparent);color:var(--success);border-color:transparent}

.rmain{min-width:0}
.rtop{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.fname{font-size:12.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fhost{font-size:11px;color:var(--muted-foreground);white-space:nowrap;flex:none}
.rbot{display:flex;align-items:center;gap:9px;margin-top:5px;font-size:11px;color:var(--muted-foreground)}
.rbot .sep{opacity:.4}
.rerr{font-size:11px;color:var(--destructive);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.segbar{position:relative;height:6px;border-radius:99px;background:var(--muted);overflow:hidden}
.segbar i{position:absolute;top:0;left:0;height:100%;background:var(--primary);transition:width .28s linear}
.segbar[data-state="completed"] i{background:var(--success)}
.segbar[data-state="failed"] i{background:color-mix(in oklab,var(--destructive) 55%,var(--muted))}
.segbar[data-state="paused"] i,.segbar[data-state="queued"] i,.segbar[data-state="cancelled"] i{background:var(--muted-foreground);opacity:.55}
.segbar[data-state="retrying"] i{background:var(--warning)}
.segbar[data-state="retrying"]::after{
  content:"";position:absolute;inset:0;border-radius:99px;
  background:linear-gradient(90deg,transparent,color-mix(in oklab,var(--warning) 45%,transparent),transparent);
  animation:sweep 1.15s linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.ractions{display:flex;align-items:center;gap:2px;opacity:0;transition:opacity .12s}
.row:hover .ractions,.row[data-active="true"] .ractions,.row:focus-within .ractions{opacity:1}
.rmeta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:88px}
.rspeed{font-size:11.5px;font-weight:600}
.reta{font-size:10.5px;color:var(--muted-foreground)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;height:100%;text-align:center;padding:40px}
.empty h3{margin:0;font-size:14px;font-weight:600}
.empty p{margin:0;font-size:12.5px;color:var(--muted-foreground);max-width:280px}
.empty .ring{width:46px;height:46px;border-radius:99px;border:1.5px dashed var(--border);display:grid;place-items:center;color:var(--muted-foreground)}

/* ---------- library view ---------- */
#library-view{display:none;flex:1;overflow-y:auto;padding:14px}
#library-view.active{display:block}
.lib-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:14px;
}
.lib-card{
  border-radius:calc(var(--radius) + 2px);border:1px solid transparent;
  overflow:hidden;cursor:pointer;position:relative;
  transition:transform .14s cubic-bezier(.2,.9,.3,1),box-shadow .14s,border-color .14s;
  background:color-mix(in oklab, var(--card) 60%, transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.lib-card:hover{
  transform:translateY(-3px) scale(1.01);
  box-shadow:var(--shadow-lg);
  border-color:var(--glass-border);
}
.lib-card:active{transform:translateY(-1px) scale(0.99)}

.lib-thumb{
  width:100%;aspect-ratio:16/9;
  background:var(--muted);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
.lib-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.lib-thumb-placeholder{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:800;opacity:.25;
  font-family:"SF Pro Display",ui-rounded,"Segoe UI",system-ui;
  color:var(--foreground);
  background:linear-gradient(135deg,color-mix(in oklab,var(--primary) 20%,var(--muted)),color-mix(in oklab,var(--primary) 8%,var(--muted)));
}
.lib-play-overlay{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:oklch(0 0 0 / .0);
  transition:background .14s;
}
.lib-card:hover .lib-play-overlay{background:oklch(0 0 0 / .35)}
.lib-play-btn{
  width:44px;height:44px;border-radius:99px;
  background:var(--primary);color:var(--primary-foreground);
  display:grid;place-items:center;
  opacity:0;transform:scale(0.7);
  transition:opacity .14s,transform .14s cubic-bezier(.2,.9,.3,1);
}
.lib-card:hover .lib-play-btn{opacity:1;transform:scale(1)}

.lib-audio-thumb{
  width:100%;aspect-ratio:1;padding:28px;
  background:linear-gradient(135deg,color-mix(in oklab,var(--success) 18%,var(--muted)),color-mix(in oklab,var(--success) 8%,var(--muted)));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
}
.lib-audio-icon{color:var(--success);opacity:.6}
.lib-audio-wave{
  display:flex;align-items:center;gap:3px;height:24px;
}
.lib-wave-bar{
  width:4px;border-radius:2px;background:var(--success);opacity:.5;
  animation:wave 1.2s ease-in-out infinite;
}
.lib-wave-bar:nth-child(1){animation-delay:0s;height:8px}
.lib-wave-bar:nth-child(2){animation-delay:.15s;height:16px}
.lib-wave-bar:nth-child(3){animation-delay:.3s;height:12px}
.lib-wave-bar:nth-child(4){animation-delay:.1s;height:20px}
.lib-wave-bar:nth-child(5){animation-delay:.25s;height:10px}
@keyframes wave{0%,100%{transform:scaleY(0.5)}50%{transform:scaleY(1)}}

.lib-meta{padding:9px 10px}
.lib-name{font-size:12px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.lib-info{font-size:10.5px;color:var(--muted-foreground);display:flex;align-items:center;gap:5px}
.lib-type-badge{
  font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:1px 5px;border-radius:4px;
  background:color-mix(in oklab,var(--primary) 14%,transparent);color:var(--primary);
}
.lib-type-badge.audio{
  background:color-mix(in oklab,var(--success) 14%,transparent);color:var(--success);
}

.lib-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  height:60vh;text-align:center;padding:40px;
}
.lib-empty-icon{width:60px;height:60px;border-radius:16px;
  background:color-mix(in oklab,var(--primary) 12%,transparent);
  display:grid;place-items:center;color:var(--primary);opacity:.6}
.lib-empty h3{margin:0;font-size:15px;font-weight:600}
.lib-empty p{margin:0;font-size:12.5px;color:var(--muted-foreground);max-width:300px}

/* ---------- library player modal ---------- */
.lib-player-scrim{
  position:fixed;inset:0;z-index:90;
  background:oklch(0 0 0 / .55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:24px;
  animation:fade .15s ease-out;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lib-player-card{
  width:100%;max-width:900px;max-height:88vh;
  border-radius:calc(var(--radius) + 6px);
  overflow:hidden;display:flex;flex-direction:column;
  background:color-mix(in oklab, var(--card) 88%, transparent);
  backdrop-filter:blur(28px) saturate(140%) brightness(1.03);
  -webkit-backdrop-filter:blur(28px) saturate(140%) brightness(1.03);
  border:1px solid color-mix(in oklab, var(--border) 40%, transparent);
  box-shadow:inset 0 1px 0 color-mix(in oklab,#fff 8%,transparent), var(--shadow-lg);
  animation:pop .2s cubic-bezier(.2,.9,.3,1);
}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:none}}
.lib-player-head{
  display:flex;align-items:center;gap:12px;padding:13px 16px;
  border-bottom:1px solid var(--border);
}
.lib-player-head .ficon{width:36px;height:36px;flex:none}
.lib-player-info{flex:1;min-width:0}
.lib-player-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-player-host{font-size:11px;color:var(--muted-foreground);margin-top:1px}
.lib-player-close{
  width:30px;height:30px;border-radius:99px;
  display:grid;place-items:center;
  color:var(--muted-foreground);transition:background .12s,color .12s;
}
.lib-player-close:hover{background:var(--accent);color:var(--foreground)}
.lib-player-body{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:0;flex:1;min-height:0}
.lib-player-body video,
.lib-player-body audio{
  width:100%;border-radius:calc(var(--radius) - 2px) calc(var(--radius) - 2px) 0 0;
  background:#000;display:block;max-height:55vh;
}
#libPlayerWrap{flex:0 0 auto;overflow:hidden}
.lib-ctrl{flex:0 0 auto;margin-top:0}
.lib-player-foot{
  display:flex;align-items:center;gap:8px;padding:10px 16px;
  border-top:1px solid var(--border);
}
.lib-player-foot .btn{font-size:12px}

/* Custom media controls bar.
   The native <video controls> UI is rendered by Qt WebEngine's Chromium
   and computes its seek-bar fill from buffered TimeRanges, which can
   disagree with currentTime when the WebM was produced with a
   header-only duration (the buffered ranges lag the actual playback
   head by a chunk). Driving the bar from `timeupdate` events and
   letting the user click anywhere on the track to seek is more
   predictable. */
.lib-ctrl{
  display:flex;align-items:center;gap:10px;
  padding:12px 4px 4px;color:#fff;
  font-size:12px;user-select:none;
  /* Solid black bar so it reads as part of the video player chrome
     (like the strip under a YouTube video), not as a separate UI
     surface. A clearly visible 2px separator at the top makes the
     bar's edge obvious even when the video is also pure black. */
  background:#000;
  border-top:2px solid #2a2a2a;
  border-radius:0 0 calc(var(--radius) - 2px) calc(var(--radius) - 2px);
}
.lib-ctrl-btn{
  width:36px;height:36px;flex:none;display:grid;place-items:center;
  border-radius:99px;border:0;background:rgba(255,255,255,.08);
  color:#fff;cursor:pointer;
  transition:background .12s, color .12s, transform .08s;
}
.lib-ctrl-btn:hover{background:rgba(255,255,255,.20)}
.lib-ctrl-btn:active{transform:scale(0.94)}
.lib-ctrl-btn svg{width:22px;height:22px;display:block;fill:#fff;stroke:none}
.lib-ctrl-time{
  font-variant-numeric:tabular-nums;color:#fff;flex:none;
  min-width:96px;text-align:center;font-size:12px;font-weight:500;
}
.lib-ctrl-seek{
  -webkit-appearance:none;appearance:none;flex:1;height:16px;
  background:transparent;cursor:pointer;padding:0;margin:0;
  /* Click target spans full height; the visible track is the inner
     gradient. Pointer events on the track surface still register on
     the input. */
}
.lib-ctrl-seek::-webkit-slider-runnable-track{
  height:5px;border-radius:99px;
  background:linear-gradient(to right,
    #5e8bff 0%, #9d6bff var(--seek-pct, 0%),
    rgba(255,255,255,.30) var(--seek-pct, 0%), rgba(255,255,255,.30) 100%);
}
.lib-ctrl-seek::-moz-range-track{
  height:5px;border-radius:99px;background:rgba(255,255,255,.30);
}
.lib-ctrl-seek::-moz-range-progress{
  height:4px;border-radius:99px;
  background:linear-gradient(to right, #5e8bff, #9d6bff);
}
.lib-ctrl-seek::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:12px;height:12px;
  border-radius:50%;background:#fff;margin-top:-4px;cursor:grab;
  box-shadow:0 0 0 3px rgba(94,139,255,.25);border:0;
}
.lib-ctrl-seek::-moz-range-thumb{
  width:12px;height:12px;border-radius:50%;background:#fff;
  border:0;cursor:grab;box-shadow:0 0 0 3px rgba(94,139,255,.25);
}
.lib-ctrl-seek:active::-webkit-slider-thumb{cursor:grabbing;transform:scale(1.08)}
.lib-ctrl-volume{
  -webkit-appearance:none;appearance:none;width:80px;height:14px;
  background:transparent;cursor:pointer;padding:0;margin:0;
}
.lib-ctrl-volume::-webkit-slider-runnable-track{
  height:3px;border-radius:99px;background:rgba(255,255,255,.16);
}
.lib-ctrl-volume::-moz-range-track{height:3px;border-radius:99px;background:rgba(255,255,255,.16)}
.lib-ctrl-volume::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:10px;height:10px;
  border-radius:50%;background:#cfd3da;margin-top:-3.5px;border:0;
}
.lib-ctrl-volume::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#cfd3da;border:0}

/* ---------- detail sheet ---------- */
.sheet{
  width:352px;flex:none;border-left:1px solid transparent;
  display:flex;flex-direction:column;overflow:hidden;
  position:relative;z-index:5;
}
.sheet-head{padding:12px 14px;border-bottom:1px solid transparent}
.sheet-head .t{display:flex;align-items:flex-start;gap:9px}
.sheet-head h2{margin:0;font-size:13px;font-weight:650;word-break:break-all;line-height:1.35}
.tabs{display:flex;gap:1px;padding:6px 8px 0;border-bottom:1px solid transparent;flex:none}
.tab{padding:6px 9px;font-size:11.5px;font-weight:550;color:var(--muted-foreground);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s,border-color .12s}
.tab:hover{color:var(--foreground)}
.tab[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.sheet-body{flex:1;overflow-y:auto;padding:13px 14px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:5px 10px;font-size:11.5px;align-items:baseline}
.kv dt{color:var(--muted-foreground)}
.kv dd{margin:0;word-break:break-all}
.hr{height:1px;background:var(--border);margin:13px 0}
.sect{font-size:10.5px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:8px}

.timeline{position:relative;height:26px;border-radius:6px;background:var(--muted);overflow:hidden;margin-bottom:7px}
.timeline i{position:absolute;top:0;height:100%}
.timeline i[data-t="ok"]{background:color-mix(in oklab,var(--primary) 62%,transparent)}
.timeline i[data-t="stall"]{background:color-mix(in oklab,var(--destructive) 46%,transparent)}
.timeline i[data-t="wait"]{background:repeating-linear-gradient(45deg,color-mix(in oklab,var(--warning) 40%,transparent) 0 4px,transparent 4px 8px)}
.tl-legend{display:flex;gap:12px;font-size:10.5px;color:var(--muted-foreground)}
.tl-legend span{display:flex;align-items:center;gap:5px}
.tl-legend b{width:8px;height:8px;border-radius:2px;display:block}

.log{display:flex;flex-direction:column;gap:0}
.log-item{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:11.5px}
.log-item:last-child{border-bottom:0}
.log-time{color:var(--muted-foreground);font-size:10.5px;padding-top:1px}
.log-item[data-lv="error"] .log-msg{color:var(--destructive)}
.log-item[data-lv="warn"] .log-msg{color:var(--warning)}
.log-item[data-lv="ok"] .log-msg{color:var(--success)}

.hdr-block{background:var(--muted);border-radius:8px;padding:9px 10px;font-size:10.5px;line-height:1.65;word-break:break-all;margin-bottom:9px}
.hdr-block .k{color:var(--primary);font-weight:600}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:oklch(0 0 0 / .40);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:grid;place-items:center;z-index:50;padding:20px;
  animation:fade .14s ease-out}
.dialog{width:100%;max-width:480px;max-height:calc(100vh - 60px);display:flex;flex-direction:column;
  background:color-mix(in oklab, var(--popover) 88%, transparent);
  backdrop-filter:blur(24px) saturate(140%) brightness(1.02);
  -webkit-backdrop-filter:blur(24px) saturate(140%) brightness(1.02);
  color:var(--popover-foreground);border:1px solid color-mix(in oklab, var(--border) 40%, transparent);
  border-radius:calc(var(--radius) + 4px);
  box-shadow:inset 0 1px 0 color-mix(in oklab,#fff 7%,transparent), var(--shadow-lg);overflow:hidden;
  animation:pop .16s cubic-bezier(.2,.9,.3,1)}
.dialog-head{padding:15px 17px 11px}
.dialog-head h2{margin:0 0 3px;font-size:14px;font-weight:650}
.dialog-head p{margin:0;font-size:12px;color:var(--muted-foreground)}
.dialog-body{padding:0 17px 15px;overflow-y:auto;flex:1}
.dialog-foot{display:flex;justify-content:flex-end;gap:7px;padding:12px 17px;border-top:1px solid var(--border);background:color-mix(in oklab,var(--muted) 40%,transparent)}
.field{margin-bottom:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.setrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.setrow:last-child{border-bottom:0}
.setrow .txt{flex:1;min-width:0}
.setrow .txt div{font-size:12.5px;font-weight:550}
.setrow .txt p{margin:2px 0 0;font-size:11.5px;color:var(--muted-foreground);line-height:1.4}

.menu{position:fixed;z-index:60;min-width:186px;padding:4px;
  background:color-mix(in oklab, var(--popover) 86%, transparent);
  backdrop-filter:blur(20px) saturate(130%);
  -webkit-backdrop-filter:blur(20px) saturate(130%);
  border:1px solid color-mix(in oklab, var(--border) 40%, transparent);
  border-radius:var(--radius);
  box-shadow:inset 0 1px 0 color-mix(in oklab,#fff 6%,transparent), var(--shadow-lg);animation:pop .11s ease-out}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:6px;font-size:12.5px;text-align:left}
.menu button:hover{background:var(--accent)}
.menu button[data-danger="true"]{color:var(--destructive)}
.menu button[data-danger="true"]:hover{background:color-mix(in oklab,var(--destructive) 12%,transparent)}
.menu .msep{height:1px;background:var(--border);margin:4px 2px}

.toasts{position:fixed;right:16px;bottom:16px;z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{display:flex;align-items:flex-start;gap:9px;min-width:250px;max-width:340px;padding:10px 12px;
  background:color-mix(in oklab, var(--popover) 86%, transparent);
  backdrop-filter:blur(20px) saturate(130%);
  -webkit-backdrop-filter:blur(20px) saturate(130%);
  border:1px solid color-mix(in oklab, var(--border) 40%, transparent);
  border-radius:var(--radius);
  box-shadow:inset 0 1px 0 color-mix(in oklab,#fff 6%,transparent), var(--shadow-lg);
  animation:slidein .2s cubic-bezier(.2,.9,.3,1)}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.toast .tt{font-size:12.5px;font-weight:600}
.toast .td{font-size:11.5px;color:var(--muted-foreground);margin-top:1px}
.toast[data-kind="ok"] .ti{color:var(--success)}
.toast[data-kind="warn"] .ti{color:var(--warning)}
.toast[data-kind="err"] .ti{color:var(--destructive)}
.toast[data-kind="info"] .ti{color:var(--primary)}

.dropzone{position:fixed;inset:0;z-index:80;
  background:color-mix(in oklab,var(--primary) 16%,oklch(0 0 0 / .3));
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:grid;place-items:center;border:2px dashed var(--primary);pointer-events:none}
.dropzone div{
  background:color-mix(in oklab, var(--popover) 90%, transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:16px 22px;border-radius:var(--radius);
  box-shadow:var(--shadow-lg);font-weight:600}

.shortcuts{display:grid;grid-template-columns:1fr auto;gap:8px 20px;font-size:12.5px;align-items:center}
.shortcuts .g{grid-column:1/-1;font-size:10.5px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;color:var(--muted-foreground);margin-top:10px}
.shortcuts .g:first-child{margin-top:0}

.hidden{display:none !important}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
@media (max-width:1080px){ .sheet{position:absolute;right:0;top:30px;bottom:0;box-shadow:var(--shadow-lg);z-index:20} }
@media (max-width:760px){ .sidebar{display:none} .sheet{width:100%} }

<body>
<div class="app">

  <div class="statusbar glass">
    <div class="tb-right">
      <div class="throughput"><b id="totalSpeed" class="mono">0 B/s</b></div>
      <div class="tb-sep"></div>
      <div class="throughput"><i class="netdot" id="netdot"></i><span id="netlabel">Connecting…</span></div>
      <button class="btn btn-ghost btn-icon" id="themeBtn" title="Toggle appearance" aria-label="Toggle appearance">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </div>
  </div>

  <div class="body">
    <nav class="sidebar glass" id="sidebar">
      <!-- View switcher -->
      <div class="view-nav" id="viewNav">
        <button class="view-btn" data-view="downloads" id="navDownloads" aria-current="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></svg>
          Downloads
          <span class="count" id="navCountDownloads">0</span>
        </button>
        <button class="view-btn" data-view="library" id="navLibrary" aria-current="false">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 10h20"/></svg>
          Library
          <span class="count" id="navCountLibrary">0</span>
        </button>
      </div>

      <div id="filters"></div>
      <div id="libFilters" style="display:none"></div>

      <div class="side-label">System</div>
      <div class="side-card glass">
        <div class="row"><span>Active slots</span><b id="slotsLabel" class="mono">0 / 0</b></div>
        <div class="row" style="margin-bottom:4px"><span>Disk free</span><b id="diskLabel" class="mono">—</b></div>
        <div class="diskbar"><i id="diskBar" style="width:0%"></i></div>
      </div>

      <div class="side-card glass">
        <div class="row" style="margin-bottom:4px"><span>Chrome extension</span><span class="badge" id="chromeBadge">—</span></div>
        <p id="chromeText" style="margin:0;font-size:11px;color:var(--muted-foreground);line-height:1.45"></p>
      </div>

      <div class="side-foot">
        <button class="btn btn-ghost" style="width:100%;justify-content:flex-start" id="settingsBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6 1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          Settings
        </button>
        <div class="app-version mono" id="appVersion"></div>
      </div>
    </nav>

    <div class="main">
      <div class="toolbar glass" id="downloadsToolbar">
        <div class="search">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="input" id="search" placeholder="Search downloads" aria-label="Search downloads">
        </div>
        <select class="input" id="sort" style="width:auto" aria-label="Sort by">
          <option value="added">Newest first</option>
          <option value="name">Name</option>
          <option value="size">Largest</option>
          <option value="speed">Fastest</option>
          <option value="progress">Progress</option>
        </select>
        <div class="tb-sep"></div>
        <div style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted-foreground);-webkit-app-region:no-drag">
          <span>Slots:</span>
          <button class="btn btn-ghost btn-icon btn-sm" id="decSlot" aria-label="Fewer concurrent downloads" title="Fewer concurrent downloads">−</button>
          <span class="mono" id="slotCount" style="min-width:18px;text-align:center">3</span>
          <button class="btn btn-ghost btn-icon btn-sm" id="incSlot" aria-label="More concurrent downloads" title="More concurrent downloads">+</button>
        </div>
        <button class="btn btn-outline" id="startAllBtn" title="Start all paused, queued and failed downloads">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
          Start all
        </button>
        <button class="btn btn-outline" id="pauseAllBtn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          Pause all
        </button>
        <button class="btn btn-outline" id="removeAllBtn" style="display:none" title="Remove all completed downloads">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          Remove all
        </button>
        <div style="margin-left:auto;display:flex;gap:7px">
          <button class="btn btn-ghost btn-icon" id="helpBtn" title="Keyboard shortcuts" aria-label="Keyboard shortcuts">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg>
          </button>
          <button class="btn btn-primary" id="addBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add download
          </button>
        </div>
      </div>

      <div class="bulkbar glass hidden" id="bulkbar">
        <span class="cb" role="checkbox" id="selectAllCb" data-bulk="all" tabindex="0" aria-label="Select all"><i class="checkbox"></i></span>
        <b id="bulkCount">Select all</b>
        <div class="tb-sep"></div>
        <button class="btn btn-sm btn-ghost" data-bulk="resume">Resume</button>
        <button class="btn btn-sm btn-ghost" data-bulk="pause">Pause</button>
        <button class="btn btn-sm btn-ghost" data-bulk="retry">Retry</button>
        <button class="btn btn-sm btn-ghost" data-bulk="remove" style="color:var(--destructive)">Remove</button>
        <button class="btn btn-sm btn-ghost" style="margin-left:auto" data-bulk="clear">Clear selection</button>
      </div>

      <div class="list" id="list"></div>
      <div id="library-view"><div class="lib-grid" id="libGrid"></div></div>
    </div>

    <aside class="sheet glass hidden" id="sheet" aria-label="Download details"></aside>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<div id="overlays"></div>
<div class="dropzone hidden" id="dropzone"><div>Drop a link to download it</div></div>

<script>
"use strict";
const TOKEN = "__FLOWDOWNLOAD_TOKEN__";
const APP_VERSION = "__FLOWDOWNLOAD_VERSION__";
document.getElementById("appVersion").textContent = "FlowDownload v"+APP_VERSION;
const KB=1024, MB=KB*1024, GB=MB*1024;

/* ---------- API ---------- */
async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({"Authorization":"Bearer "+TOKEN}, opts.headers||{});
  if(opts.body !== undefined) headers["Content-Type"] = "application/json";
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  if(!res.ok){
    let detail = res.statusText;
    try{ const j = await res.json(); if(j && j.detail) detail = j.detail; }catch(_){}
    throw new Error(detail);
  }
  const ct = res.headers.get("content-type")||"";
  return ct.includes("application/json") ? res.json() : null;
}
const getJSON = (path)=>api(path);
const post = (path, body)=>api(path, {method:"POST", body: body!==undefined?JSON.stringify(body):undefined});
const patch = (path, body)=>api(path, {method:"PATCH", body:JSON.stringify(body)});
const del = (path)=>api(path, {method:"DELETE"});

/* ---------- state ---------- */
let downloads = [];
let settingsCache = {download_dir:"~/Downloads", max_concurrent_downloads:3, notifications_enabled:true, minimize_to_tray:false, duplicate_policy:"rename"};
let diskCache = null;
let chromeCache = null;
let sheetLog = {id:null, entries:[]};
const ui={filter:"all", query:"", sort:"added", selected:new Set(), activeId:null, tab:"overview", wsConnected:false, view:"downloads", libFilter:"all"};
const history=new Array(40).fill(0);
const thumbCache=new Map(); // id -> dataURL
const LIBRARY_EXTENSIONS=["mp4","mov","webm","mkv","avi","vid","m4v","mpg","mpeg","mp3","wav","aac","m4a","flac","ogg","opus","m4b"];
// Slot bounds: shared by the toolbar +/- buttons and the Settings dialog so
// the cap never drifts between entry points.
const SLOT_MIN=1, SLOT_MAX=50;
const VIDEO_EXTENSIONS=["mp4","mov","webm","mkv","avi","vid","m4v","mpg","mpeg"];
const AUDIO_EXTENSIONS=["mp3","wav","aac","m4a","flac","ogg","opus","m4b"];

const kindOf = n => {
  const e=(n.split(".").pop()||"").toLowerCase();
  if(VIDEO_EXTENSIONS.includes(e)) return "video";
  if(["zip","dmg","tar","gz","7z","pkg","iso"].includes(e)) return "archive";
  if(["png","jpg","jpeg","gif","webp","svg","heic"].includes(e)) return "image";
  return "file";
};
const extOf = n => (n.split(".").pop()||"?").toUpperCase().slice(0,4);
function hostOf(url){ try{ return new URL(url).hostname; }catch(_){ return url; } }
function guessFilename(url){ try{ const p=decodeURIComponent(new URL(url).pathname); return p.split("/").filter(Boolean).pop()||"download"; }catch(_){ return "download"; } }

function normalize(t){
  return {
    id:t.id, name:t.filename || t.dest_path.split("/").pop(), host:hostOf(t.url), url:t.url, dest:t.dest_path,
    size:t.total_bytes, received:t.downloaded_bytes, speedBps:t.speed_bps, state:t.status,
    error:t.error_message || null, etag:t.etag, lastModified:t.last_modified,
    hasCookie:t.has_cookie, acceptRanges:t.accept_ranges, added:t.created_at*1000, updatedAt:t.updated_at*1000
  };
}
function upsert(raw){
  const n=normalize(raw);
  const i=downloads.findIndex(x=>x.id===n.id);
  if(i>=0) downloads[i]=n; else downloads.unshift(n);
}

/* ---------- library helpers ---------- */
function isMediaDownload(d){
  if(d.state !== "completed") return false;
  const ext = (d.name.split(".").pop() || "").toLowerCase();
  return LIBRARY_EXTENSIONS.includes(ext);
}
function isVideoDownload(d){
  const ext = (d.name.split(".").pop() || "").toLowerCase();
  return VIDEO_EXTENSIONS.includes(ext);
}
function isAudioDownload(d){
  const ext = (d.name.split(".").pop() || "").toLowerCase();
  return AUDIO_EXTENSIONS.includes(ext);
}
function libVisible(filter){
  filter = filter || ui.libFilter;
  return downloads.filter(d=>isMediaDownload(d) && (
    filter==="all" ||
    (filter==="video" && isVideoDownload(d)) ||
    (filter==="audio" && isAudioDownload(d))
  ));
}

/* ---------- thumbnail extraction ---------- */
const _thumbVideos=new Map(); // id -> video element
async function extractThumbnail(d){
  if(thumbCache.has(d.id)) return thumbCache.get(d.id);
  if(!isVideoDownload(d)) return null;
  const url="/api/downloads/"+d.id+"/stream";
  const v=document.createElement("video");
  v.crossOrigin="anonymous";
  v.preload="metadata";
  v.muted=true;
  v.src=url;
  _thumbVideos.set(d.id, v);
  return new Promise((resolve)=>{
    const timeout=setTimeout(()=>{
      _thumbVideos.delete(d.id); v.src=""; resolve(null);
    },4000);
    v.addEventListener("loadeddata",()=>{ v.currentTime=Math.min(1, v.duration*0.1); }, {once:true});
    v.addEventListener("seeked",()=>{
      clearTimeout(timeout);
      try{
        const c=document.createElement("canvas");
        c.width=v.videoWidth||320; c.height=v.videoHeight||180;
        const ctx=c.getContext("2d");
        ctx.drawImage(v,0,0,c.width,c.height);
        const url=c.toDataURL("image/jpeg",0.7);
        thumbCache.set(d.id,url); _thumbVideos.delete(d.id); v.src=""; resolve(url);
      }catch(e){ _thumbVideos.delete(d.id); v.src=""; resolve(null); }
    }, {once:true});
    v.addEventListener("error",()=>{ clearTimeout(timeout); _thumbVideos.delete(d.id); v.src=""; resolve(null); }, {once:true});
  });
}

/* ---------- format helpers ---------- */
const fmtBytes=b=>{ if(b<KB) return Math.round(b)+" B";
  if(b<MB) return (b/KB).toFixed(0)+" KB";
  if(b<GB) return (b/MB).toFixed(b<10*MB?1:0)+" MB";
  return (b/GB).toFixed(2)+" GB"; };
const fmtSpeed=b=>b<=0?"—":fmtBytes(b)+"/s";
const fmtEta=s=>{ if(!isFinite(s)||s<=0) return "—";
  if(s<60) return Math.round(s)+"s";
  if(s<3600) return Math.floor(s/60)+"m "+Math.round(s%60)+"s";
  return Math.floor(s/3600)+"h "+Math.round(s%3600/60)+"m"; };
const fmtTime=epochSec=>{ const d=new Date(epochSec*1000); return d.toTimeString().slice(0,8); };
// "Mon, Sep 2" or "Sep 2, 2025" depending on whether the year is current.
const fmtDate=ms=>{ const d=new Date(ms); const opts={month:"short",day:"numeric"}; if(d.getFullYear()!==new Date().getFullYear()) opts.year="numeric"; return d.toLocaleDateString(undefined,opts); };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=d=>d.size>0?Math.min(1,Math.max(0,d.received/d.size)):0;

/* ---------- toasts ---------- */
const ICONS={ok:'<path d="M20 6 9 17l-5-5"/>',warn:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>',err:'<circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'};
function toast(kind,title,desc){
  const el=document.createElement("div");
  el.className="toast"; el.dataset.kind=kind;
  el.innerHTML='<svg class="ti" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:none;margin-top:1px">'+ICONS[kind]+'</svg>'+
    '<div><div class="tt">'+esc(title)+'</div>'+(desc?'<div class="td">'+esc(desc)+'</div>':'')+'</div>';
  document.getElementById("toasts").appendChild(el);
  setTimeout(()=>{el.style.transition="opacity .2s,transform .2s";el.style.opacity="0";el.style.transform="translateX(12px)";setTimeout(()=>el.remove(),220)},4200);
}

/* ---------- sidebar ---------- */
function renderFilters(){
  const box=document.getElementById("filters");
  box.innerHTML=FILTERS.map(f=>{
    const n = f.id==="all" ? downloads.length : downloads.filter(d=>d.state===f.id).length;
    return '<button class="nav" data-filter="'+f.id+'" aria-current="'+(ui.filter===f.id)+'">'+
      '<i class="dot" style="background:'+(f.color||"var(--border)")+'"></i>'+
      esc(f.label)+'<span class="count">'+n+'</span></button>';
  }).join("");
  box.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{ui.filter=b.dataset.filter;render()});
}

function renderLibFilters(){
  const box=document.getElementById("libFilters");
  const items=[
    {id:"all", label:"All media"},
    {id:"video", label:"Videos"},
    {id:"audio", label:"Audio"},
  ];
  // Counts must be computed from the unfiltered media set; otherwise the
  // currently-active sub-filter zeros out the other two counts.
  const allMedia = downloads.filter(d => isMediaDownload(d));
  const countFor = id => id === "all" ? allMedia.length
    : allMedia.filter(d => id === "video" ? isVideoDownload(d) : isAudioDownload(d)).length;
  box.innerHTML=items.map(f=>{
    const n=countFor(f.id);
    return '<button class="nav" data-libfilter="'+f.id+'" aria-current="'+(ui.libFilter===f.id)+'">'+esc(f.label)+'<span class="count">'+n+'</span></button>';
  }).join("");
  box.querySelectorAll("[data-libfilter]").forEach(b=>b.onclick=(e)=>{
    e.preventDefault();
    e.stopPropagation();
    ui.libFilter=b.dataset.libfilter;
    renderLibFilters();
    renderLibrary();
  });
}

function renderViewNav(){
  const dlCount=downloads.length;
  const libCount=downloads.filter(d=>isMediaDownload(d)).length;
  document.getElementById("navCountDownloads").textContent=dlCount;
  document.getElementById("navCountLibrary").textContent=libCount;
  document.getElementById("navDownloads").setAttribute("aria-current", ui.view==="downloads");
  document.getElementById("navLibrary").setAttribute("aria-current", ui.view==="library");
}

function renderSystem(){
  const active = downloads.filter(d=>d.state==="downloading"||d.state==="retrying").length;
  document.getElementById("slotsLabel").textContent = active+" / "+settingsCache.max_concurrent_downloads;
  document.getElementById("slotCount").textContent = settingsCache.max_concurrent_downloads;
  // Show "Remove all" only when there's at least one completed download.
  // It's a one-click shortcut for the most common list-cleanup action --
  // separate from the bulk-bar Remove which only acts on the current selection.
  const completedCount = downloads.filter(d=>d.state==="completed").length;
  const removeAllBtn = document.getElementById("removeAllBtn");
  if(removeAllBtn){
    removeAllBtn.style.display = completedCount > 0 ? "" : "none";
    const label = " Remove all ("+completedCount+")";
    const trash = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';
    removeAllBtn.innerHTML = trash + label;
  }
  if(diskCache){
    document.getElementById("diskLabel").textContent = fmtBytes(diskCache.free_bytes)+" free";
    const usedPct = diskCache.total_bytes > 0
      ? Math.max(0, Math.min(100, 100 * (1 - diskCache.free_bytes / diskCache.total_bytes)))
      : 0;
    document.getElementById("diskBar").style.width = usedPct + "%";
  }
  const badge=document.getElementById("chromeBadge"), text=document.getElementById("chromeText");
  if(chromeCache){
    badge.textContent = chromeCache.host_registered ? "Registered" : "Missing";
    badge.className = "badge badge-"+(chromeCache.host_registered ? "completed" : "failed");
    if(chromeCache.host_registered && chromeCache.last_profile_name){
      const ageSec = (Date.now()/1000) - (chromeCache.last_ping_time || 0);
      const stale = ageSec > 60;
      const known = chromeCache.all_known_profiles || {};
      const knownCount = Object.keys(known).length;
      const profilePart = knownCount > 1
        ? "Active: "+chromeCache.last_profile_name+" (+"+(knownCount-1)+" other"+(knownCount>2?"s":"")+")"
        : "Active: "+chromeCache.last_profile_name;
      text.textContent = profilePart + (stale ? " — last seen "+Math.round(ageSec/60)+" min ago" : "");
    } else if(chromeCache.host_registered){
      text.textContent = "Native host is registered, but no extension is reporting. Reload the extension in Chrome.";
    } else {
      text.textContent = "Not registered. Run scripts/setup_chrome_integration.py, then reload the extension.";
    }
  }
}

/* ---------- library view ---------- */
async function renderLibrary(){
  const grid=document.getElementById("libGrid");
  const filter = ui.libFilter;
  let items;
  try { items = libVisible(); } catch(err) { console.error("libVisible error:", err); items = []; }
  if(!items.length){
    grid.innerHTML='<div class="lib-empty" style="grid-column:1/-1">'+
      '<div class="lib-empty-icon">'+
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 10h20"/></svg>'+
      '</div>'+
      '<h3>'+(filter!=="all"?"No "+filter+" files yet":"Your library is empty")+'</h3>'+
      '<p>'+(filter!=="all"?"Try a different filter, or download some "+filter+" files.":"Download some videos or audio files and they'll appear here automatically.")+'</p>'+
      '<button class="btn btn-primary" id="libAddBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add download</button>'+
      '</div>';
    grid.querySelector("#libAddBtn").onclick=()=>addDialog();
    return;
  }

  grid.innerHTML=items.map(d=>{
    const isVid=isVideoDownload(d);
    const ext=(d.name.split(".").pop()||"").toLowerCase();
    const init=d.name.charAt(0).toUpperCase();
    const thumbId="thumb-"+d.id;
    return '<div class="lib-card" data-libid="'+esc(d.id)+'">'+
      '<div class="lib-thumb" id="'+thumbId+'">'+
        (isVid
          ? '<div class="lib-thumb-placeholder">'+esc(init)+'</div>'
          : '<div class="lib-audio-thumb">'+
              '<svg class="lib-audio-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>'+
              '<div class="lib-audio-wave">'+
                ['<div class="lib-wave-bar"></div>','<div class="lib-wave-bar"></div>','<div class="lib-wave-bar"></div>','<div class="lib-wave-bar"></div>','<div class="lib-wave-bar"></div>'].join('')+
              '</div>'+
            '</div>'
        )+
        '<div class="lib-play-overlay"><div class="lib-play-btn">'+
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>'+
        '</div></div>'+
      '</div>'+
      '<div class="lib-meta">'+
        '<div class="lib-name" title="'+esc(d.name)+'">'+esc(d.name)+'</div>'+
        '<div class="lib-info">'+
          '<span class="lib-type-badge'+(isVid?'':' audio')+'">'+esc(isVid?'Video':'Audio')+'</span>'+
          '<span>'+esc(fmtBytes(d.size))+'</span>'+
          '<span>·</span><span>'+fmtDate(d.added)+'</span>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join("");

  // Wire card clicks — play opens the modal
  grid.querySelectorAll(".lib-card").forEach(card=>{
    card.onclick=()=>openLibPlayer(card.dataset.libid);
    card.oncontextmenu=(e)=>{e.preventDefault(); openMenu({getBoundingClientRect:()=>({left:e.clientX,bottom:e.clientY,right:e.clientX})}, card.dataset.libid); };
  });

  // Async thumbnail extraction for videos
  for(const d of items){
    if(!isVideoDownload(d)) continue;
    const el=document.getElementById("thumb-"+d.id);
    if(!el) continue;
    const url=await extractThumbnail(d);
    if(url){
      el.innerHTML='<img src="'+url+'" alt="'+esc(d.name)+'" loading="lazy">'+
        '<div class="lib-play-overlay"><div class="lib-play-btn">'+
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>'+
        '</div></div>';
    }
  }
}

/* ---------- library player modal ---------- */
// The library modal IS the player. Clicking a media card opens this
// overlay; the <video>/<audio> element streams the file directly from
// the server. The server's /stream-webm endpoint transcodes H.264/AAC
// source on-the-fly to VP9/Opus (WebM) so Qt WebEngine's open-source
// FFmpeg can decode it. Files already in WebM/Opus/VP9 are passed
// through without transcoding.
function openLibPlayer(id){
  const d=downloads.find(x=>x.id===id); if(!d) return;
  const ext=(d.name.split(".").pop()||"").toLowerCase();
  const audioExts=["mp3","wav","aac","m4a","flac","ogg"];
  const isVideo=!audioExts.includes(ext);
  const isMedia=isVideo||audioExts.includes(ext);
  const tag=isVideo?"video":"audio";

  const box=document.getElementById("overlays");
  box.innerHTML='<div class="lib-player-scrim" id="libScrim">'+
    '<div class="lib-player-card">'+
      '<div class="lib-player-head">'+
        '<div class="ficon" data-kind="'+kindOf(d.name)+'">'+extOf(d.name)+'</div>'+
        '<div class="lib-player-info">'+
          '<div class="lib-player-name">'+esc(d.name)+'</div>'+
          '<div class="lib-player-host mono">'+esc(d.host)+'</div>'+
        '</div>'+
        '<button class="lib-player-close" id="libCloseBtn" aria-label="Close player">'+
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'+
        '</button>'+
      '</div>'+
      '<div class="lib-player-body">'+
        (isMedia
          ? '<div id="libPlayerWrap" style="position:relative;width:100%;min-height:200px;background:#000;border-radius:6px 6px 0 0;display:flex;align-items:center;justify-content:center">'+
              // The actual <video> or <audio> element. Hidden until the
              // stream is ready; the transcode overlay covers it during
              // first-play conversion. We do NOT use the native
              // `controls` attribute because Qt WebEngine's built-in
              // seek bar pulls from buffered TimeRanges, which can lag
              // the actual playback head with on-the-fly WebM.
              '<'+tag+' id="libMedia" autoplay playsinline style="width:100%;border-radius:6px 6px 0 0;background:#000;display:none;max-height:60vh">'+
              'Your browser does not support '+tag+' playback.'+
              '</'+tag+'>'+
              // First-play overlay: a "Transcoding..." message with a
              // progress bar. The <video> stays hidden behind this until
              // the server reports the transcode is done.
              '<div id="libTranscode" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#e6e8ec;font-size:13px">'+
                '<div class="spinner" style="width:18px;height:18px;border:2px solid #3a3f48;border-top-color:#7d8a9c;border-radius:50%;animation:spin 0.9s linear infinite"></div>'+
                '<div>Preparing video…</div>'+
                '<div class="lib-transcode-bar" style="width:60%;max-width:300px;height:6px;background:#1f2329;border-radius:3px;overflow:hidden">'+
                  '<i id="libTranscodeFill" style="display:block;width:0%;height:100%;background:linear-gradient(90deg,#5e8bff,#9d6bff);transition:width .3s"></i>'+
                '</div>'+
                '<div id="libTranscodePct" style="font-size:11px;color:#9ba3ae;font-variant-numeric:tabular-nums">0%</div>'+
              '</div>'+
            '</div>'+
            // Custom controls bar — rendered BELOW the media element so
            // the seek bar syncs with currentTime and lets the user
            // click anywhere to seek, mute/unmute, play/pause, and
            // toggle fullscreen. Drawn from scratch because the native
            // controls are unreliable with FFmpeg-transcoded WebM.
            '<div class="lib-ctrl" id="libCtrl">'+
              '<button class="lib-ctrl-btn" id="libPlayBtn" aria-label="Play/Pause" title="Play / Pause (Space)">'+
                // Play icon (shown when paused). Swapped for a pause
                // glyph in the JS handler when the media starts.
                // Using a Unicode triangle here instead of an SVG so
                // there's no question of the icon rendering -- the
                // character is part of the font, and inherits color
                // directly.
                '<span id="libPlayIcon" style="font-size:18px;line-height:1;color:#fff">▶</span>'+
              '</button>'+
              '<span class="lib-ctrl-time" id="libTime">0:00 / 0:00</span>'+
              '<input class="lib-ctrl-seek" id="libSeek" type="range" min="0" max="100" step="0.01" value="0" aria-label="Seek" />'+
              '<button class="lib-ctrl-btn" id="libMuteBtn" aria-label="Mute" title="Mute / Unmute (M)">'+
                // Speaker icon (volume on). Replaced by muted icon
                // when toggled.
                '<span id="libVolumeIcon" style="font-size:18px;line-height:1;color:#fff">🔊</span>'+
              '</button>'+
              '<input class="lib-ctrl-volume" id="libVolume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume" />'+
              (isVideo
                ? '<button class="lib-ctrl-btn" id="libFsBtn" aria-label="Fullscreen" title="Fullscreen (F)">'+
                    '<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>'+
                  '</button>'
                : '')+
            '</div>'
          : '<div class="lib-player-no-preview">'+
              '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'+
              '<p>No in-app preview for this file type.</p>'+
            '</div>')+
      '</div>'+
      '<div class="lib-player-foot">'+
        '<button class="btn btn-outline btn-sm" data-act="reveal" data-id="'+esc(d.id)+'">'+
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>'+
          'Show in Finder'+
        '</button>'+
        '<button class="btn btn-outline btn-sm" data-act="copy" data-id="'+esc(d.id)+'">Copy link</button>'+
        '<button class="btn btn-ghost btn-sm" id="libDetailsBtn">View details</button>'+
      '</div>'+
    '</div>'+
  '</div>';

  document.getElementById("libCloseBtn").onclick=closeLibPlayer;
  document.getElementById("libScrim").addEventListener("click",e=>{ if(e.target.id==="libScrim") closeLibPlayer(); });
  document.querySelectorAll(".lib-player-foot [data-act]").forEach(b=>b.onclick=()=>act(b.dataset.id,b.dataset.act));
  document.getElementById("libDetailsBtn").onclick=()=>{ closeLibPlayer(); ui.activeId=id; ui.tab="overview"; setView("downloads"); render(); };

  if(!isMedia) return;

  // Capture references to the custom controls up front so we can
  // wire them up immediately. Without this, the buttons only become
  // functional after startPlayback() runs (i.e., after the first
  // transcode completes) -- which means clicking play/pause/mute
  // while the spinner is up does nothing.
  const mediaEl=document.getElementById("libMedia");
  const overlay=document.getElementById("libTranscode");
  const fill=document.getElementById("libTranscodeFill");
  const pctEl=document.getElementById("libTranscodePct");
  const ctrl=document.getElementById("libCtrl");
  const playBtn=document.getElementById("libPlayBtn");
  const playIcon=document.getElementById("libPlayIcon");
  const seekEl=document.getElementById("libSeek");
  const timeEl=document.getElementById("libTime");
  const muteBtn=document.getElementById("libMuteBtn");
  const volEl=document.getElementById("libVolume");
  const volIcon=document.getElementById("libVolumeIcon");
  const fsBtn=document.getElementById("libFsBtn");
  const streamUrl="/api/downloads/"+encodeURIComponent(id)+"/stream-webm";
  const statusUrl="/api/downloads/"+encodeURIComponent(id)+"/transcode-status";
  let pollTimer=null;
  let seeking=false;  // user is dragging the seek thumb — pause timeupdate

  // Unicode glyphs swapped in place when toggling play/pause and
  // mute/unmute. We use plain text characters rather than <svg>
  // so there's no question of the icon rendering: these characters
  // are part of the system font and inherit color from CSS.
  const ICON={
    play:"▶",   // U+25B6 BLACK RIGHT-POINTING TRIANGLE
    pause:"❚❚", // U+275A HEAVY VERTICAL BAR × 2
    volOn:"🔊", // U+1F50A SPEAKER WITH THREE SOUND WAVES
    volMute:"🔇", // U+1F507 SPEAKER WITH CANCELLATION STROKE
  };

  function fmt(t){
    if(!isFinite(t)||t<0) t=0;
    const m=Math.floor(t/60), s=Math.floor(t%60);
    return m+":"+(s<10?"0":"")+s;
  }

  function syncTime(){
    if(seeking) return;
    const dur=mediaEl.duration;
    const cur=mediaEl.currentTime;
    // Update the gradient fill via the CSS var the ::-webkit-slider-runnable-track
    // background reads. This drives the visual progress without
    // re-rendering anything else.
    const pct=(dur>0 && isFinite(dur)) ? (cur/dur)*100 : 0;
    seekEl.value=pct;
    seekEl.style.setProperty("--seek-pct", pct+"%");
    timeEl.textContent=fmt(cur)+" / "+fmt(dur);
  }

  function setPlayIcon(playing){
    playIcon.textContent=playing ? ICON.pause : ICON.play;
    playBtn.setAttribute("aria-label", playing?"Pause":"Play");
  }

  function setVolIcon(muted){
    volIcon.textContent=muted ? ICON.volMute : ICON.volOn;
    muteBtn.setAttribute("aria-label", muted?"Unmute":"Mute");
  }

  // --- Wire the custom controls up front, BEFORE the video is ready.
  // The buttons exist in the DOM as soon as the modal is opened;
  // attaching click handlers here means the user can mute / scrub
  // / fullscreen even while the first-play transcode is in progress.
  playBtn.onclick=()=>{
    if(mediaEl.src){
      if(mediaEl.paused) mediaEl.play().catch(()=>{});
      else mediaEl.pause();
    }
  };
  seekEl.addEventListener("input",()=>{
    seeking=true;
    const dur=mediaEl.duration;
    if(dur>0 && isFinite(dur)){
      const t=(parseFloat(seekEl.value)/100)*dur;
      timeEl.textContent=fmt(t)+" / "+fmt(dur);
      seekEl.style.setProperty("--seek-pct", seekEl.value+"%");
    }
  });
  seekEl.addEventListener("change",()=>{
    const dur=mediaEl.duration;
    if(dur>0 && isFinite(dur)){
      mediaEl.currentTime=(parseFloat(seekEl.value)/100)*dur;
    }
    seeking=false;
  });
  // Cancel `seeking` if the user lets go of the thumb anywhere
  // off the document, or if focus is lost mid-drag.
  window.addEventListener("mouseup",()=>{ if(seeking) seeking=false; });
  window.addEventListener("blur",()=>{ if(seeking) seeking=false; });

  muteBtn.onclick=()=>{
    mediaEl.muted=!mediaEl.muted;
    setVolIcon(mediaEl.muted);
  };
  volEl.addEventListener("input",()=>{
    mediaEl.volume=parseFloat(volEl.value);
    if(mediaEl.volume>0 && mediaEl.muted){
      mediaEl.muted=false;
      setVolIcon(false);
    } else if(mediaEl.volume===0 && !mediaEl.muted){
      mediaEl.muted=true;
      setVolIcon(true);
    }
  });
  if(fsBtn){
    fsBtn.onclick=()=>{
      const wrap=document.getElementById("libPlayerWrap");
      if(!wrap) return;
      if(document.fullscreenElement) document.exitFullscreen();
      else if(wrap.requestFullscreen) wrap.requestFullscreen();
    };
  }

  // Keyboard shortcuts: Space toggles play/pause, M toggles mute, F
  // toggles fullscreen. Ignore when an input is focused so we don't
  // hijack typing in the rest of the app.
  const onKey=(e)=>{
    const t=e.target;
    if(t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA")) return;
    if(e.key===" "){ e.preventDefault(); playBtn.click(); }
    else if(e.key==="m"||e.key==="M"){ e.preventDefault(); muteBtn.click(); }
    else if((e.key==="f"||e.key==="F") && fsBtn){ e.preventDefault(); fsBtn.click(); }
  };
  window.addEventListener("keydown", onKey);
  if(ctrl) ctrl._keyHandler=onKey;

  // Two paths to get the WebM:
  //   1. Cache hit (state=cached in /transcode-status): assign the
  //      stream URL directly to <video> and play.
  //   2. Cache miss: poll /transcode-status which kicks off the
  //      transcode AND reports percent. When state="cached", assign
  //      the same URL to <video> for instant playback.
  // In both cases the file is on disk before the <video> element starts
  // loading, so the WebM header (including the duration) is valid and
  // the seek bar renders correctly.

  function startPlayback(){
    if(pollTimer){clearTimeout(pollTimer); pollTimer=null;}
    mediaEl.onerror=()=>{
      const e=mediaEl.error;
      console.warn("[libPlayer] media error code="+(e?e.code:"null")+" msg="+(e&&e.message));
    };
    mediaEl.style.display="block";
    if(overlay) overlay.style.display="none";
    mediaEl.src=streamUrl;
    mediaEl.load();

    // The custom-controls click handlers (play/pause/mute/volume/
    // fullscreen/seek + keyboard shortcuts) are wired at modal-open
    // time above so the user can interact with them even before the
    // first-play transcode completes. Here we only need to attach
    // the *media element* events that drive the bar from the
    // playback head: timeupdate (4×/s while playing), loadedmetadata
    // (so the duration is shown as soon as the WebM header parses),
    // durationchange (rare but covers live streams), play/pause (to
    // swap the play button glyph), and ended (to reset the icon).
    const onPlay=()=>setPlayIcon(true);
    const onPause=()=>setPlayIcon(false);
    const onLoaded=()=>{
      syncTime();
      // Resume if autoplay was blocked.
      mediaEl.play().catch(()=>{});
    };
    mediaEl.addEventListener("play", onPlay);
    mediaEl.addEventListener("pause", onPause);
    mediaEl.addEventListener("timeupdate", syncTime);
    mediaEl.addEventListener("loadedmetadata", onLoaded);
    mediaEl.addEventListener("durationchange", syncTime);
    mediaEl.addEventListener("ended", ()=>{ syncTime(); setPlayIcon(false); });
  }

  function pollTranscodeStatus(){
    fetch(statusUrl,{headers:{"Authorization":"Bearer "+TOKEN}})
      .then(r=>r.ok ? r.json() : Promise.reject(new Error("HTTP "+r.status)))
      .then(s=>{
        if(s.state==="cached"){
          startPlayback();
          return;
        }
        // pending or transcoding -- show whatever progress we have
        // and keep polling. 1% is the floor so the bar animates
        // even before any bytes are written.
        const pct=s.percent!=null ? s.percent : 1;
        if(fill) fill.style.width=pct+"%";
        if(pctEl) pctEl.textContent=pct+"%";
        pollTimer=setTimeout(pollTranscodeStatus, 1000);
      })
      .catch(err=>{
        console.warn("[libPlayer] status poll failed:", err);
        pollTimer=setTimeout(pollTranscodeStatus, 2000);
      });
  }

  // Always start by polling the status endpoint. It tells us if the
  // cache is ready (instant play) and starts the transcode if not.
  // No need for a separate HEAD probe.
  pollTranscodeStatus();
}

function closeLibPlayer(){
  // Pause and release the media element so the FFmpeg subprocess on the
  // server side sees the client disconnect and tears down cleanly.
  const m=document.getElementById("libMedia");
  if(m){ m.pause(); m.removeAttribute("src"); m.load(); }
  // Drop the keyboard shortcut listener we attached in startPlayback
  // so it doesn't fire on a stale modal.
  const ctrl=document.getElementById("libCtrl");
  if(ctrl && ctrl._keyHandler) window.removeEventListener("keydown", ctrl._keyHandler);
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  const s=document.getElementById("libScrim");
  if(s){ s.style.opacity="0";s.style.transition="opacity .15s";setTimeout(()=>s.remove(),160); }
}

const FILTERS=[
  {id:"all", label:"All downloads", color:null},
  {id:"downloading", label:"Downloading", color:"var(--primary)"},
  {id:"retrying", label:"Retrying", color:"var(--warning)"},
  {id:"queued", label:"Queued", color:"var(--muted-foreground)"},
  {id:"paused", label:"Paused", color:"var(--muted-foreground)"},
  {id:"completed", label:"Completed", color:"var(--success)"},
  {id:"failed", label:"Failed", color:"var(--destructive)"},
  {id:"cancelled", label:"Cancelled", color:"var(--muted-foreground)"}
];

function visible(){
  let out=downloads.filter(d=>ui.filter==="all"||d.state===ui.filter);
  if(ui.query){ const q=ui.query.toLowerCase();
    out=out.filter(d=>d.name.toLowerCase().includes(q)||d.host.toLowerCase().includes(q)); }
  const s=ui.sort;
  out.sort((a,b)=> s==="name"?a.name.localeCompare(b.name)
    : s==="size"?b.size-a.size
    : s==="speed"?b.speedBps-a.speedBps
    : s==="progress"?pct(b)-pct(a)
    : b.added-a.added);
  return out;
}

function segbarHTML(d){
  const p = pct(d);
  const w = isFinite(p) ? p*100 : 0;
  return '<div class="segbar" data-state="'+d.state+'" role="progressbar" aria-valuenow="'+Math.round(w)+'" aria-valuemin="0" aria-valuemax="100">'+
    '<i style="width:'+w+'%"></i></div>';
}

function rowMeta(d){
  if(d.state==="completed") return '<div class="rspeed" style="color:var(--success)">Done</div><div class="reta">'+fmtBytes(d.size)+'</div>';
  if(d.state==="failed")    return '<div class="rspeed" style="color:var(--destructive)">Failed</div><div class="reta">'+fmtBytes(d.received)+' of '+fmtBytes(d.size)+'</div>';
  if(d.state==="cancelled") return '<div class="rspeed" style="color:var(--muted-foreground)">Cancelled</div><div class="reta">'+fmtBytes(d.received)+' of '+fmtBytes(d.size)+'</div>';
  if(d.state==="retrying")  return '<div class="rspeed" style="color:var(--warning)">Retrying</div><div class="reta">'+Math.round(pct(d)*100)+'%</div>';
  if(d.state==="paused")    return '<div class="rspeed" style="color:var(--muted-foreground)">Paused</div><div class="reta">'+Math.round(pct(d)*100)+'%</div>';
  if(d.state==="queued")    return '<div class="rspeed" style="color:var(--muted-foreground)">Queued</div><div class="reta">'+fmtBytes(d.size)+'</div>';
  const etaText = d.speedBps > 0 ? fmtEta((d.size-d.received)/d.speedBps)+' left' : '—';
  return '<div class="rspeed mono">'+fmtSpeed(d.speedBps)+'</div><div class="reta mono">'+etaText+'</div>';
}

const PAUSE='<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
const RETRY='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>';
const FOLDER='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>';
const DOTS='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>';

function renderList(){

      '<h3>'+(ui.query?"No matches":"Nothing here yet")+'</h3>'+

  list.innerHTML=items.map(d=>{
