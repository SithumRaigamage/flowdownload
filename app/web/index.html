/* ---------- actions ---------- */
async function act(id,what){
  const d=downloads.find(x=>x.id===id); if(!d) return;
  try{
    if(what==="pause") await post("/api/downloads/"+id+"/pause");
    else if(what==="resume") await post("/api/downloads/"+id+"/resume");
    else if(what==="retry") await post("/api/downloads/"+id+"/retry");
    else if(what==="reveal"){ await post("/api/downloads/"+id+"/reveal"); toast("ok","Revealed in "+FILE_MANAGER,d.name); }
    else if(what==="details"){ ui.activeId=id; ui.tab="overview"; render(); }
    else if(what==="copy"){
      try{ await navigator.clipboard.writeText(d.url); toast("ok","Link copied",d.host); }
      catch(_){ toast("err","Couldn't copy link","Clipboard access was blocked"); }
    }
    else if(what==="play"){
      // If in library view, open the glass player. Otherwise open sheet preview.
      if(ui.view==="library"){ openLibPlayer(id); }
      else { ui.activeId = id; ui.tab = "preview"; render(); }
    }
    else if(what==="cancel"){
      await post("/api/downloads/"+id+"/cancel");
      toast("info","Cancelled",d.received>0?"Downloaded data was discarded":d.name);
    }
    else if(what==="remove") removeDownloads([d]);
    else if(what==="deletefile") confirmDeleteFile(d);
    else if(what==="refresh") refreshLinkDialog(d);
  }catch(err){ toast("err","Action failed",err.message); }
}

// Give an unfinished download a new URL (e.g. a re-signed CDN link). The
// partial file is kept: the server's ETag check decides resume vs restart.
function refreshLinkDialog(d){
  const dlg=overlay('<div class="dialog" style="max-width:480px" role="dialog" aria-modal="true" aria-labelledby="refTitle">'+
    '<div class="dialog-head"><h2 id="refTitle">Refresh link</h2>'+
    '<p>Paste a new link for <b>'+esc(d.name)+'</b>. Downloaded data is kept and resumed if the server still has the same file.</p></div>'+
    '<div class="dialog-body"><div class="field"><label class="label" for="refUrl">New link</label>'+
    '<input class="input mono" id="refUrl" placeholder="https://…"></div></div>'+
    '<div class="dialog-foot"><button class="btn btn-ghost" data-close>Cancel</button>'+
    '<button class="btn btn-primary" id="refGo">Refresh and resume</button></div></div>');
  const input=dlg.querySelector("#refUrl"), go=dlg.querySelector("#refGo");
  input.focus();
  input.addEventListener("keydown",e=>{ if(e.key==="Enter") go.click(); });
  go.onclick=async()=>{
    const url=input.value.trim();
    if(!url){ input.focus(); return; }
    try{
      upsert(await post("/api/downloads/"+d.id+"/refresh-url",{url}));
      closeOverlay(); toast("ok","Link refreshed",d.name); render();
    }catch(err){ toast("err","Couldn't refresh link",err.message); }
  };
}

// Remove from the list. A completed file always stays on disk, but an
// unfinished download's partial data is discarded with it (nothing could
// resume it any more) -- so that case asks first instead of claiming the
// file was kept.
async function removeDownloads(items){
  const partial=items.filter(d=>d.state!=="completed" && d.received>0);
  const go=async()=>{
    try{
      await Promise.all(items.map(d=>del("/api/downloads/"+d.id+"?delete_file=false")));
      const ids=new Set(items.map(d=>d.id));
      downloads=downloads.filter(x=>!ids.has(x.id));
      ids.forEach(id=>{ ui.selected.delete(id); thumbCache.delete(id); });
      if(ids.has(ui.activeId)) ui.activeId=null;
      const title=items.length===1?"Removed from list":"Removed "+items.length+" downloads";
      toast("info",title,partial.length?"Unfinished downloads' partial data was discarded":"Files on disk were kept");
      render();
    }catch(err){ toast("err","Couldn't remove",err.message); }
  };
  if(!partial.length){ await go(); return; }
  const bytes=partial.reduce((n,d)=>n+d.received,0);
  const what=partial.length===1?'<b>'+esc(partial[0].name)+'</b> isn\'t finished':partial.length+' of these downloads aren\'t finished';
  const dlg=overlay('<div class="dialog" style="max-width:420px" role="alertdialog" aria-modal="true" aria-labelledby="remTitle">'+
    '<div class="dialog-head"><h2 id="remTitle">Discard partial data?</h2>'+
    '<p>'+what+'. Removing '+(items.length===1?'it':'them')+' deletes the '+esc(fmtBytes(bytes))+' downloaded so far. Completed files are kept.</p></div>'+
    '<div class="dialog-foot"><button class="btn btn-ghost" data-close>Keep</button>'+
    '<button class="btn btn-primary" id="remGo" style="background:var(--destructive)">Remove and discard</button></div></div>');
  dlg.querySelector("#remGo").onclick=async()=>{ closeOverlay(); await go(); };
}

// Remove from the list AND delete the file from disk. Permanent (not the
// Trash), so it always asks first -- plain "Remove" stays one click.
function confirmDeleteFile(d){
  const dlg=overlay('<div class="dialog" style="max-width:420px" role="alertdialog" aria-modal="true" aria-labelledby="delTitle">'+
    '<div class="dialog-head"><h2 id="delTitle">Delete file?</h2>'+
    '<p><b>'+esc(d.name)+'</b> will be permanently deleted from disk. This can\'t be undone.</p></div>'+
    '<div class="dialog-foot"><button class="btn btn-ghost" data-close>Cancel</button>'+
    '<button class="btn btn-primary" id="delGo" style="background:var(--destructive)">Delete file</button></div></div>');
  const go=dlg.querySelector("#delGo");  // overlay() focuses Cancel -- the safe default
  go.onclick=async()=>{
    try{
      await del("/api/downloads/"+d.id+"?delete_file=true");
      downloads=downloads.filter(x=>x.id!==d.id); ui.selected.delete(d.id);
      thumbCache.delete(d.id);
      if(ui.activeId===d.id) ui.activeId=null;
      closeOverlay(); toast("info","File deleted",d.name); render();
    }catch(err){ toast("err","Couldn't delete file",err.message); }
  };
}

/* ---------- dialogs ---------- */
let _overlayLastFocused=null;
function closeOverlay(){
  document.getElementById("overlays").innerHTML="";
  // Return focus to whatever opened the dialog -- without this, closing
  // (Escape, the Cancel/Done button, or clicking the scrim) dropped
  // keyboard focus to <body>, forcing a keyboard user to re-navigate from
  // the top of the page instead of picking up where they left off.
  if(_overlayLastFocused && document.contains(_overlayLastFocused)) _overlayLastFocused.focus();
  _overlayLastFocused=null;
}
function overlay(html){
  _overlayLastFocused=document.activeElement;
  const box=document.getElementById("overlays");
  box.innerHTML='<div class="scrim" id="scrim">'+html+'</div>';
  const scrim=document.getElementById("scrim");
  scrim.addEventListener("mousedown",e=>{ if(e.target.id==="scrim") closeOverlay(); });
  // Focus trap: Tab/Shift+Tab cycles within the dialog instead of leaking
  // focus out into the (still-present, just visually dimmed) app behind it.
  scrim.addEventListener("keydown",e=>{
    if(e.key!=="Tab") return;
    const focusable=[...box.querySelectorAll('input,select,button,textarea,[tabindex]')]
      .filter(el=>!el.disabled && el.offsetParent!==null);
    if(!focusable.length) return;
    const first=focusable[0], last=focusable[focusable.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  });
  const first=box.querySelector("input,select,button"); if(first) first.focus();
  return box.querySelector(".dialog");
}

function addDialog(prefillUrl){
  const dlg=overlay('<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="addTitle">'+
    '<div class="dialog-head"><h2 id="addTitle">Add download</h2><p>Paste a link. FlowDownload asks the server for the real filename.</p></div>'+
    '<div class="dialog-body">'+
      '<div class="field"><label class="label" for="addUrl">Link</label>'+
        '<input class="input mono" id="addUrl" placeholder="https://example.com/file.zip" value="'+esc(prefillUrl||"")+'"></div>'+
      '<div class="field"><label class="label" for="addFolder">Save to folder</label>'+
        '<div style="display:flex;gap:8px"><input class="input mono" id="addFolder" readonly value="'+esc(settingsCache.download_dir)+'" style="flex:1">'+
        '<button class="btn btn-outline btn-sm" id="addBrowse">Browse</button></div></div>'+
      '<div class="field"><label class="label" for="addName">Filename</label>'+
        '<input class="input" id="addName" placeholder="download" value=""></div>'+
    '</div>'+
    '<div class="dialog-foot"><button class="btn btn-outline" data-close>Cancel</button>'+
      '<button class="btn btn-primary" id="addGo">Add download</button></div></div>');

  let filenameAuto=true;
  let probeTimer=null;
  const urlInput=dlg.querySelector("#addUrl"), nameInput=dlg.querySelector("#addName");

  function onUrlChanged(){
    const url=urlInput.value.trim();
    if(!url) return;
    if(filenameAuto) nameInput.value=guessFilename(url);
    if(probeTimer) clearTimeout(probeTimer);
    if(url.startsWith("http://")||url.startsWith("https://")){
      probeTimer=setTimeout(async()=>{
        try{ const r=await getJSON("/api/probe?url="+encodeURIComponent(url));
          if(filenameAuto) nameInput.value=r.filename; }catch(_){}
      },600);
    }
  }
  urlInput.addEventListener("input",onUrlChanged);
  nameInput.addEventListener("input",()=>{filenameAuto=false});
  if(prefillUrl) onUrlChanged();

  dlg.querySelector("#addBrowse").onclick=async()=>{
    try{ const r=await post("/api/pick-folder");
      if(r.path){
        dlg.querySelector("#addFolder").value=r.path;
        settingsCache = await patch("/api/settings",{download_dir:r.path});
      }
    }catch(err){ toast("err","Couldn't open folder picker",err.message); }
  };

  dlg.querySelector("#addGo").onclick=async()=>{
    const url=urlInput.value.trim();
    const name=nameInput.value.trim()||"download";
    if(!url){ toast("err","Add a link first","The URL field is empty"); return; }
    let parsed;
    try{ parsed=new URL(url); }catch(_){ toast("err","That doesn't look like a valid link","Include the http:// or https:// part"); return; }
    if(parsed.protocol!=="http:"&&parsed.protocol!=="https:"){
      toast("err","Only http:// and https:// links are supported",parsed.protocol+" isn't"); return;
    }
    try{
      // Only a filename goes to the server -- the destination folder is
      // always the current default (changed via Browse above, which
      // already saved it to settings), never sent as a path from here.
      const task=await post("/api/downloads", {url, filename: name});
      upsert(task); closeOverlay(); render();
      if(task.status==="completed") toast("info","Already downloaded",task.filename+" — kept the existing file");
      else toast("ok","Added",task.filename);
    }catch(err){ toast("err","Couldn't start download",err.message); }
  };
}

          ["system","light","dark"].map(t=>'<option value="'+t+'"'+((settingsCache.theme||"system")===t?" selected":"")+'>'+t[0].toUpperCase()+t.slice(1)+'</option>').join("")+
        '</select></div>'+
      switchRow("Keep running when the window closes","The red close button minimizes to the menu bar instead of quitting.","minimize_to_tray",settingsCache.minimize_to_tray)+
      switchRow("Notify when a download finishes","A macOS notification for completed or failed downloads.","notifications_enabled",settingsCache.notifications_enabled),
    Downloads: '<div class="field" style="padding-top:10px"><label class="label">Default folder</label>'+
      '<div style="display:flex;gap:8px"><input class="input mono" id="setDownloadDir" readonly value="'+esc(settingsCache.download_dir)+'" style="flex:1">'+
      '<button class="btn btn-outline btn-sm" id="setBrowseDir">Browse</button></div></div>'+
      '<div class="field"><label class="label">Downloads at once</label>'+
      '<div style="display:flex;gap:8px;align-items:center">'+
        '<input class="input mono" type="number" min="'+SLOT_MIN+'" max="'+SLOT_MAX+'" step="1" id="setMaxConcurrent" data-input="max_concurrent_downloads" value="'+esc(settingsCache.max_concurrent_downloads)+'" style="flex:1;width:auto">'+
        '<button class="btn btn-primary btn-sm" id="setMaxSave">Save</button>'+
      '</div>'+
      '<p style="font-size:11px;color:var(--muted-foreground);margin:6px 0 0">Type any number from 1 to 50. Saving starts queued downloads immediately.</p>'+
      '</div>'+
      '<div class="field"><label class="label" for="setSiteConns">Connections per site (optional)</label>'+
      '<div style="display:flex;gap:8px;align-items:center">'+
        '<input class="input mono" type="number" min="0" max="50" step="1" id="setSiteConns" value="'+esc(settingsCache.site_connection_limit||0)+'" style="flex:1;width:auto">'+
        '<button class="btn btn-primary btn-sm" id="setSiteConnsSave">Save</button>'+
      '</div>'+
      '<p style="font-size:11px;color:var(--muted-foreground);margin:6px 0 0">0 = no limit, so Downloads at once decides. Set a number only if a site starts failing with many downloads at once (some servers refuse above about 12). Subdomains count as one site, e.g. v1 and v2.cdnde.com.</p>'+
      '</div>'+
      '<div class="field"><label class="label" for="setConnections">Connections per download</label>'+
      '<div style="display:flex;gap:8px;align-items:center">'+
        '<input class="input mono" type="number" min="1" max="8" step="1" id="setConnections" value="'+esc(settingsCache.connections_per_download||1)+'" style="flex:1;width:auto">'+
        '<button class="btn btn-primary btn-sm" id="setConnSave">Save</button>'+
      '</div>'+
      '<p style="font-size:11px;color:var(--muted-foreground);margin:6px 0 0">Large files (8 MB+) on servers that support it are split across this many connections. Each connection counts toward Connections per site when that limit is set. 1 turns splitting off.</p>'+
      '</div>'+
      switchRow("Organize by type","Route downloads into Video / Audio / Documents / Archives subfolders based on file extension.","auto_folder_by_type",settingsCache.auto_folder_by_type)+

      '<select class="input" id="setDupPolicy" data-input="duplicate_policy" style="width:auto">'+

        '<option value="skip"'+(settingsCache.duplicate_policy==="skip"?" selected":"")+'>Skip — keep the existing file</option>'+
        '<option value="overwrite"'+(settingsCache.duplicate_policy==="overwrite"?" selected":"")+'>Overwrite the existing file</option>'+
      '</select>'+

    About: '<div class="setrow" style="padding-top:12px"><div class="txt"><div>FlowDownload</div><p>Resumable download manager for macOS</p></div>'+

}

async function settingsDialog(){
  // Both fall back to whatever's already cached on failure (better than a
  // blank dialog), but that fallback used to be silent -- a failed load
  // looked identical to a successful one, so a stale/broken settings view
  // gave no indication anything was wrong.
  try{ settingsCache=await getJSON("/api/settings"); }
  catch(err){ toast("err","Couldn't load settings",err.message); }
  try{ chromeCache=await getJSON("/api/chrome-status"); }catch(_){}
  const tabs=["General","Downloads","Chrome","Advanced","About"];
  const panes=settingsPanes();

  const dlg=overlay('<div class="dialog" style="max-width:540px" role="dialog" aria-modal="true" aria-labelledby="setTitle">'+
    '<div class="dialog-head"><h2 id="setTitle">Settings</h2></div>'+
    '<div class="tabs" style="padding:0 17px" role="tablist">'+tabs.map((t,i)=>'<button class="tab" role="tab" data-st="'+t+'" aria-selected="'+(i===0)+'">'+t+'</button>').join("")+'</div>'+
    '<div class="dialog-body" id="setPane" style="padding-top:4px">'+panes.General+'</div>'+
    '<div class="dialog-foot"><button class="btn btn-primary" data-close>Done</button></div></div>');

  function wirePane(){
    const dirBrowse=dlg.querySelector("#setBrowseDir");
    if(dirBrowse) dirBrowse.onclick=async()=>{
      try{ const r=await post("/api/pick-folder");
        if(r.path){ settingsCache=await patch("/api/settings",{download_dir:r.path}); refreshTab(); toast("ok","Default folder updated"); } }
      catch(err){ toast("err","Couldn't change folder",err.message); }
    };
    const maxInput=dlg.querySelector("[data-input='max_concurrent_downloads']");
    const maxSave=dlg.querySelector("#setMaxSave");
    if(maxInput && maxSave){
      maxInput.addEventListener("keydown",e=>{ if(e.key==="Enter") maxSave.click(); });
      maxSave.onclick=async()=>{
        const val=Math.max(SLOT_MIN,Math.min(SLOT_MAX,Math.round(+maxInput.value)));
        maxInput.value=val;
        try{ settingsCache=await patch("/api/settings",{max_concurrent_downloads:val}); toast("ok","Saved — "+val+" download"+(val!==1?"s":"")+" at once"); render(); }
        catch(err){ toast("err","Couldn't save setting",err.message); }
      };
    }
    const connInput=dlg.querySelector("#setConnections"), connSave=dlg.querySelector("#setConnSave");
    if(connInput && connSave){
      connInput.addEventListener("keydown",e=>{ if(e.key==="Enter") connSave.click(); });
      connSave.onclick=async()=>{
        const val=Math.max(1,Math.min(8,Math.round(+connInput.value)||1));
        connInput.value=val;
        try{ settingsCache=await patch("/api/settings",{connections_per_download:val}); toast("ok","Saved — "+val+" connection"+(val!==1?"s":"")+" per download"); }
        catch(err){ toast("err","Couldn't save setting",err.message); }
      };
    }
    const siteInput=dlg.querySelector("#setSiteConns"), siteSave=dlg.querySelector("#setSiteConnsSave");
    if(siteInput && siteSave){
      siteInput.addEventListener("keydown",e=>{ if(e.key==="Enter") siteSave.click(); });
      siteSave.onclick=async()=>{
        const val=Math.max(0,Math.min(50,Math.round(+siteInput.value)||0));
        siteInput.value=val;
        try{ settingsCache=await patch("/api/settings",{site_connection_limit:val}); toast("ok",val?"Saved — "+val+" connection"+(val!==1?"s":"")+" per site":"Saved — no per-site limit"); render(); }
        catch(err){ toast("err","Couldn't save setting",err.message); }
      };
    }
    const themeSel=dlg.querySelector("#setTheme");
    if(themeSel) themeSel.addEventListener("change",()=>setTheme(themeSel.value));
    const dupPolicy=dlg.querySelector("#setDupPolicy");
    if(dupPolicy) dupPolicy.addEventListener("change",async()=>{
      const val=dupPolicy.value;
      try{ settingsCache=await patch("/api/settings",{duplicate_policy:val}); toast("ok","Saved"); }
      catch(err){ dupPolicy.value=settingsCache.duplicate_policy; toast("err","Couldn't save setting",err.message); }
    });
    const clearBtn=dlg.querySelector("#setClearCompleted");
    if(clearBtn) clearBtn.onclick=async()=>{
      try{
        const r=await post("/api/downloads/clear-completed");
        // Mirror removeAllBtn's local cleanup -- the server call alone
        // doesn't touch the in-memory `downloads` array, so without this
        // cleared items stayed visible in the list until an unrelated
        // event happened to trigger a re-render.
        const completed=downloads.filter(d=>d.state==="completed");
        downloads=downloads.filter(d=>d.state!=="completed");
        completed.forEach(d=>thumbCache.delete(d.id));
        if(ui.activeId && completed.find(d=>d.id===ui.activeId)) ui.activeId=null;
        toast("ok","Cleared "+r.removed+" completed downloads","Files are kept on disk");
        render();
      }
      catch(err){ toast("err","Couldn't clear completed",err.message); }
    };
    const resetBtn=dlg.querySelector("#setResetAll");
    if(resetBtn) resetBtn.onclick=async()=>{
      try{ settingsCache=await post("/api/settings/reset"); refreshTab(); toast("ok","Settings reset to defaults"); render(); }
      catch(err){ toast("err","Couldn't reset settings",err.message); }
    };
  }
  function refreshTab(){
    const active=dlg.querySelector("[data-st][aria-selected='true']").dataset.st;
    dlg.querySelector("#setPane").innerHTML=settingsPanes()[active];
    wirePane();
  }
  wirePane();

  dlg.addEventListener("click",async e=>{
    const st=e.target.closest("[data-st]");
    if(st){ dlg.querySelectorAll("[data-st]").forEach(x=>x.setAttribute("aria-selected",x===st)); refreshTab(); return; }
    const sw=e.target.closest("[data-setting]");
    if(sw){
      const key=sw.dataset.setting, newVal=sw.getAttribute("aria-checked")!=="true";
      sw.setAttribute("aria-checked",newVal);
      try{ settingsCache=await patch("/api/settings",{[key]:newVal}); }
      catch(err){ sw.setAttribute("aria-checked",!newVal); toast("err","Couldn't save setting",err.message); }
    }
  });
}

function shortcutsDialog(){
  const rows=[["Downloads",""],["Add a download","⌘N"],["Search","⌘F"],["Select all","⌘A"],["Pause or resume selection","Space"],
    ["Remove from list","⌘⌫"],
    ["View",""],["Show details","↵"],["Toggle appearance","⌘⇧L"],["Settings","⌘,"],["Shortcuts","⌘/"]];
  overlay('<div class="dialog" style="max-width:380px" role="dialog" aria-modal="true"><div class="dialog-head"><h2>Keyboard shortcuts</h2></div>'+
    '<div class="dialog-body"><div class="shortcuts">'+
    rows.map(r=>r[1]===""?'<div class="g">'+r[0]+'</div>':'<span>'+r[0]+'</span><span class="kbd">'+r[1]+'</span>').join("")+
    '</div></div><div class="dialog-foot"><button class="btn btn-primary" data-close>Close</button></div></div>');
}

document.getElementById("addBtn").onclick=()=>addDialog();
document.getElementById("settingsBtn").onclick=settingsDialog;
document.getElementById("helpBtn").onclick=shortcutsDialog;
document.addEventListener("click",e=>{ if(e.target.closest("[data-close]")) closeOverlay(); });

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  const meta=e.metaKey||e.ctrlKey;
  const typing=/input|textarea|select/i.test(e.target.tagName);
  if(e.key==="Escape"){
    if(document.getElementById("libScrim")){ closeLibPlayer(); return; }
    if(document.getElementById("scrim")){ closeOverlay(); return; }
    if(ui.activeId){ui.activeId=null;render()} closeMenu(); return;
  }
  if(meta&&e.key==="n"){ e.preventDefault(); addDialog(); return; }
  if(meta&&e.key==="f"){ e.preventDefault(); document.getElementById("search").focus(); return; }
  if(meta&&e.key===","){ e.preventDefault(); settingsDialog(); return; }
  if(meta&&e.key==="/"){ e.preventDefault(); shortcutsDialog(); return; }
  if(meta&&e.shiftKey&&e.key.toLowerCase()==="l"){ e.preventDefault(); toggleTheme(); return; }
  if(typing) return;
  if(meta&&e.key.toLowerCase()==="a"&&ui.view==="downloads"){ e.preventDefault(); toggleSelectAll(); return; }
  if(e.key===" "&&ui.activeId){ e.preventDefault();
    const d=downloads.find(x=>x.id===ui.activeId);
    if(d) act(d.id, d.state==="downloading"||d.state==="retrying"?"pause":"resume"); }
  if(meta&&e.key==="Backspace"&&ui.activeId){ e.preventDefault(); act(ui.activeId,"remove"); }
});

/* ---------- drag & drop ---------- */
const dz=document.getElementById("dropzone");
let dragDepth=0;
window.addEventListener("dragenter",e=>{e.preventDefault();dragDepth++;dz.classList.remove("hidden")});
window.addEventListener("dragover",e=>e.preventDefault());
window.addEventListener("dragleave",()=>{ if(--dragDepth<=0) dz.classList.add("hidden") });
window.addEventListener("drop",e=>{ e.preventDefault(); dragDepth=0; dz.classList.add("hidden");
  const url=e.dataTransfer.getData("text/uri-list")||e.dataTransfer.getData("text/plain");
  addDialog(url); });

/* ---------- live connection ---------- */
let ws=null, wsRetryMs=1000, wsEverConnected=false;
function connectWS(){
  const proto = location.protocol==="https:" ? "wss:" : "ws:";
  ws=new WebSocket(proto+"//"+location.host+"/api/events?token="+encodeURIComponent(TOKEN));
  ws.onopen=async()=>{
    const reconnect=wsEverConnected;
    wsEverConnected=true; ui.wsConnected=true; wsRetryMs=1000; renderStats();
    // Events sent while we were disconnected are gone for good, so a
    // reconnect re-reads the whole list instead of trusting a stale one.
    if(reconnect){
      try{
        downloads=(await getJSON("/api/downloads")).map(normalize);
        const ids=new Set(downloads.map(d=>d.id));
        ui.selected=new Set([...ui.selected].filter(id=>ids.has(id)));
        if(ui.activeId && !ids.has(ui.activeId)) ui.activeId=null;
        render();
      }catch(_){}
    }
  };
  ws.onmessage=e=>{
    const msg=JSON.parse(e.data);
    if(msg.type==="added"){ upsert(msg.download); render(); }
    else if(msg.type==="updated"){
      const n=normalize(msg.download);
      const i=downloads.findIndex(x=>x.id===n.id);
      if(i<0){ upsert(n); render(); return; }
      const prev=downloads[i];
      downloads[i]=n;
      // Live update in downloads view
      if(ui.view==="downloads"){
        const orderChanging = (ui.sort==="speed" && prev.speedBps!==n.speedBps)
          || (ui.sort==="size" && prev.size!==n.size)
          || (ui.sort==="progress" && pct(prev)!==pct(n));
        // A state change needs a full render: the row's badge and actions,
        // the filter counts, list membership under a status filter, and the
        // wait reason on every queued row (a slot was freed or taken) all
        // depend on it. Rare next to progress ticks, so this stays cheap.
        if(orderChanging || prev.state!==n.state){ render(); return; }
        const el=document.querySelector('.row[data-id="'+n.id+'"]');
        if(el){
          const ring=el.querySelector(".mring");
          if(ring){
            ring.style.background=ringBG(n);
            ring.setAttribute("aria-label", Math.round(pct(n)*100)+"% downloaded");
            ring.firstChild.textContent = n.state==="completed" ? "✓" : String(Math.round(pct(n)*100));
          }
          const meta=el.querySelector(".rmeta"); if(meta) meta.innerHTML=rowMeta(n);
          const bot=el.querySelector(".rbot"); if(bot) bot.innerHTML=rbotHTML(n);
        }

        renderHero(); renderStats(); renderSystem(); renderViewNav();
        if(ui.activeId===n.id) renderSheet();
      } else {
        // Library view — re-render if this item is media and might have changed state.
        // Gated the same way for both: renderLibFilters' counts only include
        // completed media (see isMediaDownload), so a non-media or still-
        // downloading item's progress ticks never change them -- rebuilding
        // its innerHTML on every tick anyway just thrashed the tab buttons'
        // DOM nodes, dropping :hover mid-hover and making them flicker.
        if(isMediaDownload(n)){
          renderLibrary();
          renderLibFilters();
        }
        renderViewNav();
      }
    }
    else if(msg.type==="removed"){
      downloads=downloads.filter(d=>d.id!==msg.id);
      ui.selected.delete(msg.id);
      thumbCache.delete(msg.id);
      if(ui.activeId===msg.id) ui.activeId=null;
      if(ui.view==="library") renderLibrary();
      renderViewNav(); render();
    }
  };
  ws.onclose=()=>{ ui.wsConnected=false; renderStats(); setTimeout(connectWS, wsRetryMs); wsRetryMs=Math.min(wsRetryMs*1.6,10000); };
  ws.onerror=()=>{ ws.close(); };
}

async function boot(){
  try{
    const [tasks, settings, disk, chrome] = await Promise.all([
      getJSON("/api/downloads"), getJSON("/api/settings"), getJSON("/api/disk"), getJSON("/api/chrome-status"),
    ]);
    downloads = tasks.map(normalize);
    settingsCache = settings; diskCache = disk; chromeCache = chrome;
    applyTheme(settingsCache.theme);
  }catch(err){ toast("err","Couldn't load downloads",err.message); }
  // Start in downloads view. render() below ensures the library count is
  // populated even when downloads were already completed before this session.
  setView("downloads");
  render();
  renderSpeedBars();
  connectWS();
  setInterval(async()=>{
    try{ diskCache=await getJSON("/api/disk"); }catch(_){}
    try{ chromeCache=await getJSON("/api/chrome-status"); }catch(_){}
    renderSystem();
  }, 30000);
}
boot();
</script>
