<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 260px; font: 13px system-ui, sans-serif; margin: 0; padding: 10px; background: #fff; color: #222; }
    .header { font-weight: 600; margin-bottom: 8px; font-size: 13px; }
    button { display: block; width: 100%; padding: 7px 10px; margin: 0 0 6px;
      border: 1px solid #d0d0d0; border-radius: 5px; background: #f5f5f5;
      cursor: pointer; font: inherit; text-align: left; }
    button:hover { background: #eaeaea; }
    .toggle { display: flex; gap: 6px; align-items: center; margin: 8px 0 4px; }
    textarea { width: 100%; box-sizing: border-box; height: 52px; font: 11px ui-monospace, monospace;
      border: 1px solid #d0d0d0; border-radius: 5px; padding: 4px; resize: vertical; }
    label.small { display: block; font-size: 11px; color: #666; margin: 6px 0 2px; }
    .meta { font-size: 11px; color: #666; margin-top: 6px; line-height: 1.4; }
    .url { font-size: 11px; color: #1a73e8; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; margin: 2px 0; }
  </style>
</head>
<body>
  <div class="header">FlowDownload</div>
  <button id="openApp">Open FlowDownload</button>
  <label class="toggle"><input type="checkbox" id="intercept"> Send Chrome downloads to FlowDownload</label>
  <label class="small" for="excluded">Keep downloads in Chrome for these sites (one per line):</label>
  <textarea id="excluded" placeholder="example.com" spellcheck="false"></textarea>
  <div id="pendingList"></div>
  <div class="meta" id="meta">Loading…</div>
  <script src="popup.js"></script>
</body>
</html>
