name: Release

# Push a tag like v1.2.0 (matching the VERSION file) to build installers for
# macOS, Windows and Linux and publish them as a GitHub Release. A tag with a
# suffix (v1.2.0-rc1) is published as a pre-release. See docs/RELEASING.md.
# Running it by hand (Actions > Release > Run workflow) is a dry run: it
# builds and uploads the installers as workflow artifacts, but publishes nothing.
on:
  push:
    tags: ["v*"]
    branches: [release-pipeline]  # TEMP: dry runs before merge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-22.04   # oldest supported glibc -> runs on the most distros
            label: linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check the tag matches VERSION
        shell: bash
        run: |
          file="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "VERSION=$file" >> "$GITHUB_ENV"   # dry run
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          if [[ "${tag%%-*}" != "$file" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($file). Bump VERSION, commit, and re-tag."
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libdbus-1-3

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Build with PyInstaller
        run: pyinstaller FlowDownload.spec -y

      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        run: packaging/macos/make_dmg.sh "dist/FlowDownload-${VERSION}-${{ matrix.label }}.dmg"

      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1 -ExpandProperty FullName
          }
          & $iscc "/DAppVersion=$env:VERSION" packaging\windows\FlowDownload.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (Linux AppImage + tarball)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
          # Runners have no FUSE; let appimagetool unpack itself instead.
          APPIMAGE_EXTRACT_AND_RUN=1 packaging/linux/make_packages.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            dist/FlowDownload-*.dmg
            dist/FlowDownload-*-setup.exe
            dist/FlowDownload-*.AppImage
            dist/FlowDownload-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload its files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Add the Chrome extension and checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip -r "assets/FlowDownload-${version}-chrome-extension.zip" chrome_extension
          cd assets && sha256sum FlowDownload-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: FlowDownload ${{ github.ref_name }}
          body_path: .github/release-body.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: assets/*
